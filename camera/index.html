<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhoneCam → PC (Zero-Server Direct P2P)</title>
<style>
:root{color-scheme:dark;--bg:#101318;--panel:#1a2029;--line:#303947;--text:#eef3f8;--muted:#aab5c3;--accent:#58a6ff;--red:#ff5d67;--green:#44d19a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1100px;margin:auto;padding:22px}h1{font-size:clamp(22px,3.5vw,34px);margin:0 0 6px}p{color:var(--muted);margin:6px 0 14px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:4px 9px;color:var(--muted);font-size:12px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
h2{font-size:18px;margin:0 0 10px}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 4px}
input,select,textarea,button{font:inherit;border-radius:10px}input,select,textarea{width:100%;padding:10px 12px;background:#0e1218;border:1px solid var(--line);color:var(--text);resize:vertical}
textarea{font-family:monospace;font-size:11px;height:70px}
button{border:0;padding:10px 14px;background:var(--accent);color:#07111d;font-weight:700;cursor:pointer;margin:8px 6px 0 0}
button.secondary{background:#313b49;color:var(--text)}button.danger{background:#ff5d67;color:#21070a}button:disabled{opacity:.4;cursor:not-allowed}
video{display:block;width:100%;max-height:360px;background:#050607;border-radius:12px;aspect-ratio:16/9;object-fit:contain;margin-top:10px}
.status{border-radius:10px;background:#0e1218;border:1px solid var(--line);padding:10px 12px;color:var(--muted);min-height:38px;margin-top:10px;font-size:13px;overflow-wrap:anywhere}.status.good{color:var(--green)}.status.bad{color:#ff9da3}
.small{font-size:12px;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;align-items:center}.step-box{background:#141922;border:1px solid var(--line);padding:10px;border-radius:10px;margin-top:10px}
@media(max-width:760px){main{padding:14px}.layout{grid-template-columns:1fr}.panel{padding:13px}}
</style>
</head>
<body>
<main>
  <span class="tag">ZERO-SERVER · GITHUB READY · WEBRTC P2P</span>
  <h1>PhoneCam <span style="color:var(--accent)">→</span> PC</h1>
  <p>Direct wireless camera streaming without server dropouts. Works on GitHub Pages or locally.</p>

  <div class="layout">
    <!-- PHONE PANEL -->
    <section class="panel">
      <h2>📱 Step 1: Phone Camera</h2>
      <label for="facing">Camera / Quality</label>
      <div style="display:flex;gap:8px;">
        <select id="facing"><option value="environment">Rear</option><option value="user">Front</option></select>
        <select id="quality"><option value="1280">HD 720p</option><option value="1920">FHD 1080p</option><option value="640">SD 480p</option></select>
      </div>
      
      <div class="actions">
        <button id="startCam">1. Start Camera</button>
        <button id="stopCam" class="secondary" disabled>Stop</button>
      </div>
      <video id="localVideo" autoplay playsinline muted></video>

      <div class="step-box">
        <label>2. Copy this Offer & send to PC:</label>
        <textarea id="phoneOffer" readonly placeholder="Click 'Generate Offer' after starting camera..."></textarea>
        <button id="genOffer" disabled>Generate Offer Code</button>
      </div>

      <div class="step-box">
        <label>4. Paste Answer from PC here:</label>
        <textarea id="phoneAnswerInput" placeholder="Paste PC answer code here..."></textarea>
        <button id="applyAnswer" disabled>Complete Connection</button>
      </div>

      <div id="phoneStatus" class="status">Start your camera to begin.</div>
    </section>

    <!-- PC PANEL -->
    <section class="panel">
      <h2>🖥️ Step 2: PC Receiver & Recorder</h2>
      
      <div class="step-box">
        <label>3. Paste Offer from Phone here:</label>
        <textarea id="pcOfferInput" placeholder="Paste phone offer code here..."></textarea>
        <button id="processOffer">Generate Answer Code</button>
      </div>

      <div class="step-box">
        <label>Copy this Answer & paste back to Phone:</label>
        <textarea id="pcAnswerOutput" readonly placeholder="Generated answer will appear here..."></textarea>
      </div>

      <label>Live Camera Preview:</label>
      <video id="remoteVideo" autoplay playsinline controls></video>
      
      <div class="actions">
        <button id="record" disabled>● Start Recording</button>
        <button id="stopRecord" class="danger" disabled>■ Stop & Save</button>
      </div>
      <div id="pcStatus" class="status">Waiting for phone offer input.</div>
    </section>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let pc = null, localStream = null, remoteStream = null;
  let recorder = null, chunks = [];

  function setStatus(id, msg, kind="") {
    const el = $(id); el.textContent = msg; el.className = "status" + (kind ? " " + kind : "");
  }

  function createPeerConnection() {
    if (pc) { try { pc.close(); } catch(e){} }
    pc = new RTCPeerConnection({
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    });
    pc.ontrack = e => {
      remoteStream = e.streams[0];
      $("remoteVideo").srcObject = remoteStream;
      $("remoteVideo").play().catch(()=>{});
      $("record").disabled = false;
      setStatus("pcStatus", "Connected successfully! Live stream received.", "good");
    };
  }

  // --- PHONE SIDE LOGIC ---
  $("startCam").addEventListener("click", async () => {
    try {
      const width = Number($("quality").value);
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true },
        video: { facingMode: { ideal: $("facing").value }, width: { ideal: width }, height: { ideal: Math.round(width * 9 / 16) } }
      });
      $("localVideo").srcObject = localStream;
      $("startCam").disabled = true;
      $("stopCam").disabled = false;
      $("genOffer").disabled = false;
      setStatus("phoneStatus", "Camera active. Now click 'Generate Offer Code'.", "good");
    } catch (err) {
      setStatus("phoneStatus", "Camera error: " + err.message, "bad");
    }
  });

  $("stopCam").addEventListener("click", () => {
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    localStream = null;
    $("localVideo").srcObject = null;
    $("startCam").disabled = false;
    $("stopCam").disabled = true;
    $("genOffer").disabled = true;
    setStatus("phoneStatus", "Camera stopped.");
  });

  $("genOffer").addEventListener("click", async () => {
    if (!localStream) return;
    createPeerConnection();
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    // Wait a brief moment for ICE candidates to gather
    setTimeout(() => {
      $("phoneOffer").value = JSON.stringify(pc.localDescription);
      $("phoneOffer").select();
      $("phoneAnswerInput").disabled = false;
      $("applyAnswer").disabled = false;
      setStatus("phoneStatus", "Offer generated! Copy it and paste it into the PC panel.", "good");
    }, 1000);
  });

  $("applyAnswer").addEventListener("click", async () => {
    try {
      const answerVal = $("phoneAnswerInput").value.trim();
      if (!answerVal) return;
      const answer = JSON.parse(answerVal);
      await pc.setRemoteDescription(new RTCSessionDescription(answer));
      setStatus("phoneStatus", "Connection established with PC!", "good");
    } catch (err) {
      setStatus("phoneStatus", "Failed to apply answer: " + err.message, "bad");
    }
  });

  // --- PC SIDE LOGIC ---
  $("processOffer").addEventListener("click", async () => {
    const offerVal = $("pcOfferInput").value.trim();
    if (!offerVal) {
      setStatus("pcStatus", "Please paste the phone's offer code first.", "bad");
      return;
    }
    try {
      createPeerConnection();
      const offer = JSON.parse(offerVal);
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      setTimeout(() => {
        $("pcAnswerOutput").value = JSON.stringify(pc.localDescription);
        $("pcAnswerOutput").select();
        setStatus("pcStatus", "Answer generated! Copy it and paste it back into the phone panel.", "good");
      }, 1000);
    } catch (err) {
      setStatus("pcStatus", "Error processing offer: " + err.message, "bad");
    }
  });

  // --- PC RECORDING LOGIC ---
  function supportedMime() {
    const types = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm", "video/mp4"];
    return types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
  }

  $("record").addEventListener("click", () => {
    if (!remoteStream) return;
    try {
      chunks = [];
      const mimeType = supportedMime();
      recorder = new MediaRecorder(remoteStream, mimeType ? { mimeType } : undefined);
      
      recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: recorder.mimeType || "video/webm" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "phone-cam-" + new Date().toISOString().slice(0,19).replace(/[:T]/g,"-") + ".webm";
        document.body.appendChild(a); a.click(); a.remove();
        setStatus("pcStatus", "Recording saved to your PC downloads!", "good");
      };

      recorder.start(1000);
      $("record").disabled = true;
      $("stopRecord").disabled = false;
      setStatus("pcStatus", "● Recording live stream...", "good");
    } catch (err) {
      setStatus("pcStatus", "Recording failed: " + err.message, "bad");
    }
  });

  $("stopRecord").addEventListener("click", () => {
    if (recorder && recorder.state !== "inactive") {
      recorder.stop();
      $("stopRecord").disabled = true;
      $("record").disabled = false;
    }
  });
})();
</script>
</body>
</html>
