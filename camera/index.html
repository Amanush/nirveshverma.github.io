<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhoneCam → PC (QR Pairing)</title>
<!-- Include QRCode and ZXing library for QR generation & scanning -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.19.1"></script>
<style>
:root{color-scheme:dark;--bg:#101318;--panel:#1a2029;--line:#303947;--text:#eef3f8;--muted:#aab5c3;--accent:#58a6ff;--red:#ff5d67;--green:#44d19a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1100px;margin:auto;padding:22px}h1{font-size:clamp(22px,3.5vw,34px);margin:0 0 6px}p{color:var(--muted);margin:6px 0 14px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:4px 9px;color:var(--muted);font-size:12px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
h2{font-size:18px;margin:0 0 10px}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 4px}
input,select,textarea,button{font:inherit;border-radius:10px}input,select,textarea{width:100%;padding:10px 12px;background:#0e1218;border:1px solid var(--line);color:var(--text)}
textarea{font-family:monospace;font-size:11px;height:55px;resize:vertical}
button{border:0;padding:10px 14px;background:var(--accent);color:#07111d;font-weight:700;cursor:pointer;margin:8px 6px 0 0}
button.secondary{background:#313b49;color:var(--text)}button.danger{background:#ff5d67;color:#21070a}button:disabled{opacity:.4;cursor:not-allowed}
video{display:block;width:100%;max-height:320px;background:#050607;border-radius:12px;aspect-ratio:16/9;object-fit:contain;margin-top:10px}
.status{border-radius:10px;background:#0e1218;border:1px solid var(--line);padding:10px 12px;color:var(--muted);min-height:38px;margin-top:10px;font-size:13px;overflow-wrap:anywhere}.status.good{color:var(--green)}.status.bad{color:#ff9da3}
.qr-container{background:#fff;padding:10px;border-radius:10px;display:inline-block;margin-top:10px;text-align:center}
.qr-container canvas, .qr-container img{display:block;margin:auto}
.step-box{background:#141922;border:1px solid var(--line);padding:10px;border-radius:10px;margin-top:10px}
@media(max-width:760px){main{padding:14px}.layout{grid-template-columns:1fr}.panel{padding:13px}}
</style>
</head>
<body>
<main>
  <span class="tag">QR CODE P2P · ZERO CONFIG</span>
  <h1>PhoneCam <span style="color:var(--accent)">→</span> PC</h1>
  <p>Scan a QR code to link your phone camera to your computer instantly.</p>

  <div class="layout">
    <!-- PHONE PANEL -->
    <section class="panel">
      <h2>📱 Phone Camera</h2>
      <label for="facing">Camera / Quality</label>
      <div style="display:flex;gap:8px;">
        <select id="facing"><option value="environment">Rear</option><option value="user">Front</option></select>
        <select id="quality"><option value="1280">HD 720p</option><option value="1920">FHD 1080p</option></select>
      </div>
      
      <div class="actions">
        <button id="startCam">1. Start Camera</button>
        <button id="stopCam" class="secondary" disabled>Stop</button>
      </div>
      <video id="localVideo" autoplay playsinline muted></video>

      <div class="step-box">
        <label>2. Your Connection QR Code:</label>
        <div id="qrcode" class="qr-container hidden"></div>
        <button id="genQR" disabled>Generate QR Code</button>
      </div>

      <div class="step-box">
        <label>Or paste PC Answer Token manually if scanning fails:</label>
        <textarea id="phoneAnswerInput" placeholder="Paste PC answer token here..."></textarea>
        <button id="applyAnswer" disabled>Link Connection</button>
      </div>

      <div id="phoneStatus" class="status">Start your camera to begin.</div>
    </section>

    <!-- PC PANEL -->
    <section class="panel">
      <h2>🖥️ PC Receiver & Recorder</h2>
      
      <div class="step-box">
        <label>3. Scan Phone QR Code with PC Webcam:</label>
        <div class="actions">
          <button id="startScan">Scan QR via Webcam</button>
          <button id="stopScan" class="secondary" disabled>Stop Scanner</button>
        </div>
        <video id="scannerVideo" class="hidden" muted playsinline style="max-height:180px;"></video>
        <label style="margin-top:8px;">Or paste phone offer token directly:</label>
        <textarea id="pcOfferInput" placeholder="Paste phone offer token here..."></textarea>
        <button id="processOffer">Connect via Token</button>
      </div>

      <label>Live Camera Preview:</label>
      <video id="remoteVideo" autoplay playsinline controls></video>
      
      <div class="actions">
        <button id="record" disabled>● Start Recording</button>
        <button id="stopRecord" class="danger" disabled>■ Stop & Save</button>
      </div>
      <div id="pcStatus" class="status">Scan the phone's QR code or paste token.</div>
    </section>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let pc = null, localStream = null, remoteStream = null, codeReader = null;
  let recorder = null, chunks = [];

  function setStatus(id, msg, kind="") {
    const el = $(id); el.textContent = msg; el.className = "status" + (kind ? " " + kind : "");
  }

  function createPeerConnection() {
    if (pc) { try { pc.close(); } catch(e){} }
    pc = new RTCPeerConnection({
      iceServers: [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }]
    });
    pc.ontrack = e => {
      remoteStream = e.streams[0];
      $("remoteVideo").srcObject = remoteStream;
      $("remoteVideo").play().catch(()=>{});
      $("record").disabled = false;
      setStatus("pcStatus", "Connected successfully! Live stream received.", "good");
    };
  }

  function gatherCompleteDescription(peerConnection) {
    return new Promise((resolve) => {
      if (peerConnection.iceGatheringState === "complete") {
        resolve(peerConnection.localDescription);
        return;
      }
      function checkState() {
        if (peerConnection.iceGatheringState === "complete") {
          peerConnection.removeEventListener("icegatheringstatechange", checkState);
          resolve(peerConnection.localDescription);
        }
      }
      peerConnection.addEventListener("icegatheringstatechange", checkState);
      setTimeout(() => resolve(peerConnection.localDescription), 3000);
    });
  }

  // --- PHONE LOGIC ---
  $("startCam").addEventListener("click", async () => {
    try {
      const width = Number($("quality").value);
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true },
        video: { facingMode: { ideal: $("facing").value }, width: { ideal: width }, height: { ideal: Math.round(width * 9 / 16) } }
      });
      $("localVideo").srcObject = localStream;
      $("startCam").disabled = true;
      $("stopCam").disabled = false;
      $("genQR").disabled = false;
      setStatus("phoneStatus", "Camera active. Click 'Generate QR Code'.", "good");
    } catch (err) {
      setStatus("phoneStatus", "Camera error: " + err.message, "bad");
    }
  });

  $("stopCam").addEventListener("click", () => {
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    localStream = null;
    $("localVideo").srcObject = null;
    $("startCam").disabled = false;
    $("stopCam").disabled = true;
    $("genQR").disabled = true;
    $("qrcode").classList.add("hidden");
    setStatus("phoneStatus", "Camera stopped.");
  });

  $("genQR").addEventListener("click", async () => {
    if (!localStream) return;
    createPeerConnection();
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    setStatus("phoneStatus", "Generating connection offer...");
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    const completeOffer = await gatherCompleteDescription(pc);
    const offerStr = encodeURIComponent(JSON.stringify(completeOffer));

    // Generate QR code representation
    try {
      const qr = qrcode(0, 'L');
      qr.addData(offerStr);
      qr.make();
      $("qrcode").innerHTML = qr.createHtmlTag(4);
      $("qrcode").classList.remove("hidden");
      $("phoneAnswerInput").disabled = false;
      $("applyAnswer").disabled = false;
      setStatus("phoneStatus", "QR Code ready! Scan it with your PC webcam.", "good");
    } catch (e) {
      // Fallback if data string is too long for QR capacity
      setStatus("phoneStatus", "Token too large for QR. Copy text from console instead.", "bad");
      console.log("Offer Token:", JSON.stringify(completeOffer));
    }
  });

  $("applyAnswer").addEventListener("click", async () => {
    try {
      const answerVal = $("phoneAnswerInput").value.trim();
      if (!answerVal) return;
      await pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(answerVal)));
      setStatus("phoneStatus", "Successfully linked to PC!", "good");
    } catch (err) {
      setStatus("phoneStatus", "Link failed: " + err.message, "bad");
    }
  });

  // --- PC QR SCANNER & RECEIVER LOGIC ---
  async function processOfferCode(offerJsonStr) {
    try {
      createPeerConnection();
      setStatus("pcStatus", "Connecting via token...");
      const offer = JSON.parse(decodeURIComponent(offerJsonStr));
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      const completeAnswer = await gatherCompleteDescription(pc);
      
      // Put answer into phone input box text area equivalent or show user
      const answerStr = JSON.stringify(completeAnswer);
      prompt("Connection successful! Copy this answer token and paste it into your phone's manual box if needed:", answerStr);
      setStatus("pcStatus", "Connection handshake generated!", "good");
    } catch (err) {
      setStatus("pcStatus", "Error connecting: " + err.message, "bad");
    }
  }

  $("processOffer").addEventListener("click", () => {
    const val = $("pcOfferInput").value.trim();
    if (val) processOfferCode(val);
  });

  $("startScan").addEventListener("click", () => {
    if (typeof ZXing === "undefined") {
      setStatus("pcStatus", "QR Scanner library loading failed. Check internet connection.", "bad");
      return;
    }
    codeReader = new ZXing.BrowserQRCodeReader();
    $("scannerVideo").classList.remove("hidden");
    $("stopScan").disabled = false;
    $("startScan").disabled = true;
    setStatus("pcStatus", "Looking for phone QR code in webcam view...");

    codeReader.decodeFromVideoDevice(undefined, 'scannerVideo', (result, err) => {
      if (result) {
        codeReader.reset();
        $("scannerVideo").classList.add("hidden");
        $("stopScan").disabled = true;
        $("startScan").disabled = false;
        processOfferCode(result.text);
      }
    }).catch(err => {
      setStatus("pcStatus", "Webcam scanner error: " + err, "bad");
    });
  });

  $("stopScan").addEventListener("click", () => {
    if (codeReader) codeReader.reset();
    $("scannerVideo").classList.add("hidden");
    $("stopScan").disabled = true;
    $("startScan").disabled = false;
    setStatus("pcStatus", "Scanner stopped.");
  });

  // --- RECORDING ---
  function supportedMime() {
    const types = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm", "video/mp4"];
    return types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
  }

  $("record").addEventListener("click", () => {
    if (!remoteStream) return;
    try {
      chunks = [];
      const mimeType = supportedMime();
      recorder = new MediaRecorder(remoteStream, mimeType ? { mimeType } : undefined);
      recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: recorder.mimeType || "video/webm" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "phone-cam-" + new Date().toISOString().slice(0,19).replace(/[:T]/g,"-") + ".webm";
        document.body.appendChild(a); a.click(); a.remove();
        setStatus("pcStatus", "Recording saved to PC downloads!", "good");
      };
      recorder.start(1000);
      $("record").disabled = true;
      $("stopRecord").disabled = false;
      setStatus("pcStatus", "● Recording live stream...", "good");
    } catch (err) {
      setStatus("pcStatus", "Recording error: " + err.message, "bad");
    }
  });

  $("stopRecord").addEventListener("click", () => {
    if (recorder && recorder.state !== "inactive") {
      recorder.stop();
      $("stopRecord").disabled = true;
      $("record").disabled = false;
    }
  });
})();
</script>
</body>
</html>
