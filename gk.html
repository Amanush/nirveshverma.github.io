<head>
<meta charset="UTF-8">

<title>GK Revision — History, Polity, Geography, Constitution</title>
<style>
  :root{
    --bg:#ffffff; --card:#ffffff; --card2:#f4f4f4; --line:#1a1a1a; --line-soft:#cfcfcf;
    --text:#111111; --sub:#5a5a5a; --inv-bg:#111111; --inv-text:#ffffff;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
  header{position:sticky;top:0;background:var(--bg);border-bottom:2px solid var(--line);padding:10px 14px;z-index:10;}
  h1{font-size:15px;margin:0 0 8px;font-weight:700;letter-spacing:.2px;}
  .stats{display:flex;gap:10px;font-size:11px;color:var(--sub);margin-bottom:8px;flex-wrap:wrap;border-top:1px dashed var(--line-soft);padding-top:6px;}
  .stats b{color:var(--text);}
  .controls{display:flex;gap:6px;flex-wrap:wrap;}
  select,input[type=text],button{
    background:#fff;color:var(--text);border:1.5px solid var(--line);
    border-radius:6px;padding:7px 9px;font-size:12px;font-family:inherit;
  }
  input[type=text]{flex:1;min-width:120px;}
  button{cursor:pointer;font-weight:600;}
  button.active{background:var(--inv-bg);color:var(--inv-text);}
  main{padding:12px;max-width:640px;margin:0 auto;padding-bottom:80px;}
  .card{
    background:var(--card);border:1.5px solid var(--line);border-radius:10px;
    padding:16px;margin-bottom:12px;cursor:pointer;position:relative;
  }
  .tags{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
  .tag{font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--text);font-weight:600;}
  .tag.dim{color:var(--sub);border-color:var(--line-soft);font-weight:400;}
  .tag.filled{background:var(--inv-bg);color:var(--inv-text);border-color:var(--inv-bg);}
  .q{font-size:14.5px;font-weight:600;line-height:1.4;}
  .a{margin-top:10px;padding-top:10px;border-top:1.5px dashed var(--line);display:none;}
  .card.open .a{display:block;}
  .ans{font-size:14px;color:var(--text);font-weight:700;}
  .extra{font-size:11.5px;color:var(--sub);margin-top:4px;}
  .rowbtns{display:flex;gap:8px;margin-top:12px;}
  .rowbtns button{flex:1;font-size:11px;padding:6px;background:#fff;}
  .card.known{opacity:.4;}
  .empty{text-align:center;color:var(--sub);padding:40px 10px;font-size:13px;}
  footer{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid var(--line);
    padding:8px 14px;display:flex;justify-content:space-between;font-size:11px;color:var(--text);font-weight:600;}
  .badge{background:var(--card2);padding:4px 8px;border-radius:6px;border:1px solid var(--line-soft);}
</style>
</head>
<body>

<header>
  <h1>GK Revision — India History · Geography · Polity · Constitution</h1>
  <div class="controls">
    <select id="fPeriod"></select>

      <option value="A">A — Must know</option>
      <option value="B">B — Likely</option>
      <option value="C">C — Low priority</option>

    <button id="fMP">MP-linked only</button>
    <button id="fUnknown">Unrevised only</button>
    <input type="text" id="fSearch" placeholder="Search...">
  </div>
  <div class="stats" id="stats"></div>
</header>

<main id="main"></main>

<footer>

</footer>

/* ===========================================================
   MERGE ALL BATCHES → single working array
   =========================================================== */
let ALL_CARDS = [];
Object.values(CARD_BATCHES).forEach(batch => ALL_CARDS = ALL_CARDS.concat(batch));
ALL_CARDS = ALL_CARDS.map((c,i)=>({...c, id:"c"+i}));

/* ===========================================================
   APP LOGIC
   =========================================================== */
const LS_KEY = "gk_revision_progress_v1";
let progress = JSON.parse(localStorage.getItem(LS_KEY) || "{}");

function saveProgress(){ localStorage.setItem(LS_KEY, JSON.stringify(progress)); }

const periodSel = document.getElementById('fPeriod');
const periods = ["", ...new Set(ALL_CARDS.map(c=>c.period))];
periodSel.innerHTML = periods.map(p=>`<option value="${p}">${p||"All periods"}</option>`).join("");

let state = { period:"", priority:"", mpOnly:false, unknownOnly:false, search:"" };

function render(){
  const main = document.getElementById('main');
  let cards = ALL_CARDS.filter(c=>{
    if(state.period && c.period!==state.period) return false;
    if(state.priority && c.priority!==state.priority) return false;
    if(state.mpOnly && !c.mp) return false;
    if(state.unknownOnly && progress[c.id]==="known") return false;
    if(state.search){
      const s = state.search.toLowerCase();
      if(!(c.q.toLowerCase().includes(s) || c.topic.toLowerCase().includes(s) || (c.a||"").toLowerCase().includes(s))) return false;
    }
    return true;
  });

  document.getElementById('countTxt').textContent = cards.length + " cards";
  const knownCount = ALL_CARDS.filter(c=>progress[c.id]==="known").length;
  document.getElementById('progTxt').textContent = Math.round(knownCount/ALL_CARDS.length*100) + "% revised";

  const byPeriod = {};
  ALL_CARDS.forEach(c=>{ byPeriod[c.period]=(byPeriod[c.period]||0)+1; });
  document.getElementById('stats').innerHTML =
    `<span><b>${ALL_CARDS.length}</b> total</span>` +
    Object.entries(byPeriod).map(([p,n])=>`<span>${p}: <b>${n}</b></span>`).join("");

  if(cards.length===0){
    main.innerHTML = `<div class="empty">No cards match this filter.</div>`;
    return;
  }

  main.innerHTML = cards.map(c=>{
    const st = progress[c.id];
    return `
    <div class="card ${st==='known'?'known':''}" data-id="${c.id}">
      <div class="tags">
        <span class="tag dim">${c.period}</span>
        <span class="tag dim">${c.topic}</span>
        <span class="tag filled">${c.priority}</span>
        ${c.mp?'<span class="tag">MP</span>':''}
      </div>
      <div class="q">${c.q}</div>
      <div class="a">
        <div class="ans">${c.a}</div>
        ${c.extra?`<div class="extra">${c.extra}</div>`:''}
        <div class="rowbtns">
          <button onclick="mark(event,'${c.id}','known')">✓ Know it</button>
          <button onclick="mark(event,'${c.id}','review')">↻ Review again</button>
        </div>
      </div>
    </div>`;
  }).join("");

  document.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click', ()=> el.classList.toggle('open'));
  });
}

function mark(ev, id, status){
  ev.stopPropagation();
  progress[id] = status;
  saveProgress();
  render();
}

periodSel.addEventListener('change', e=>{ state.period = e.target.value; render(); });
document.getElementById('fPriority').addEventListener('change', e=>{ state.priority = e.target.value; render(); });
document.getElementById('fMP').addEventListener('click', e=>{ state.mpOnly = !state.mpOnly; e.target.classList.toggle('active', state.mpOnly); render(); });
document.getElementById('fUnknown').addEventListener('click', e=>{ state.unknownOnly = !state.unknownOnly; e.target.classList.toggle('active', state.unknownOnly); render(); });
document.getElementById('fSearch').addEventListener('input', e=>{ state.search = e.target.value; render(); });

render();
</script>
