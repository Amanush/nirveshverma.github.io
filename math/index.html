<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MP Vyapam Maths — Revision</title>
<style>
  :root{
    --bg:#fff; --fg:#111; --line:#111; --muted:#666; --panel:#f4f4f4;
    --accent:#111; --wrong:#111; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--fg); -webkit-tap-highlight-color:transparent;
  }
  header{
    position:sticky; top:0; background:#fff; border-bottom:2px solid var(--line);
    padding:12px 16px; display:flex; align-items:center; justify-content:space-between; z-index:10;
  }
  header .title{font-weight:700; font-size:15px; letter-spacing:.2px;}
  header .sub{font-size:11px; color:var(--muted);}
  .home-btn{
    border:1.5px solid var(--line); background:#fff; color:var(--fg);
    padding:6px 12px; border-radius:8px; font-size:13px; cursor:pointer; font-weight:600;
  }
  .home-btn:active{background:#eee;}
  main{max-width:680px; margin:0 auto; padding:16px;}

  /* HOME / CHAPTER LIST */
  .chapter-list{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
  .chapter-item{
    border:1.5px solid var(--line); border-radius:var(--radius); padding:12px 14px;
    display:flex; justify-content:space-between; align-items:center; cursor:pointer;
    background:#fff;
  }
  .chapter-item:active{background:#f0f0f0;}
  .chapter-item.disabled{color:#aaa; border-color:#ccc; cursor:default;}
  .chapter-item .cname{font-size:14.5px; font-weight:600;}
  .chapter-item .ccount{font-size:12px; color:var(--muted);}
  .chapter-item.disabled .ccount{color:#bbb;}

  /* QUESTION VIEW */
  .qmeta{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:12px; color:var(--muted);}
  .progress-bar{height:4px; background:#eee; border-radius:2px; overflow:hidden; margin-bottom:16px;}
  .progress-fill{height:100%; background:var(--fg);}
  .qcard{border:1.5px solid var(--line); border-radius:var(--radius); padding:18px; min-height:180px;}
  .qtext{font-size:16px; line-height:1.5; margin-bottom:16px; white-space:pre-wrap;}
  .opt{
    display:flex; gap:10px; align-items:flex-start; border:1px solid #ccc; border-radius:8px;
    padding:10px 12px; margin-bottom:8px; font-size:14.5px; cursor:pointer;
  }
  .opt:active{background:#f5f5f5;}
  .opt .lab{font-weight:700; min-width:18px;}
  .opt.correct{border-color:var(--fg); background:#eee; font-weight:600;}
  .opt.selected-wrong{border-color:var(--fg); text-decoration:line-through; color:var(--muted);}

  .actions{display:flex; gap:8px; margin-top:14px;}
  .actions button{
    flex:1; padding:11px 8px; border-radius:8px; border:1.5px solid var(--line);
    background:#fff; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .actions button.primary{background:var(--fg); color:#fff;}
  .actions button:active{opacity:.75;}

  .navbar{display:flex; gap:8px; margin-top:16px;}
  .navbar button{
    flex:1; padding:13px; border-radius:8px; border:1.5px solid var(--line);
    background:#fff; font-size:14px; font-weight:700; cursor:pointer;
  }
  .navbar button:disabled{opacity:.3;}
  .navbar button:active:not(:disabled){background:#eee;}

  /* MODAL */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
    align-items:flex-end; justify-content:center; z-index:100;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:#fff; width:100%; max-width:680px; border-radius:16px 16px 0 0;
    padding:20px; max-height:75vh; overflow-y:auto; border-top:2px solid var(--line);
  }
  .modal h3{margin:0 0 10px; font-size:15px; letter-spacing:.3px;}
  .modal .ans-line{font-size:14px; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid #ddd;}
  .modal .sol-text{font-size:14.5px; line-height:1.55; white-space:pre-wrap;}
  .modal-close{
    display:block; width:100%; margin-top:16px; padding:12px; border-radius:8px;
    border:1.5px solid var(--line); background:var(--fg); color:#fff; font-weight:700; font-size:14px;
  }
  .flag{display:inline-block; font-size:11px; border:1px solid var(--muted); color:var(--muted); border-radius:6px; padding:1px 6px; margin-left:6px;}

  .jumpbar{display:flex; gap:6px; overflow-x:auto; padding:4px 0 14px; -webkit-overflow-scrolling:touch;}
  .jumpbar button{
    flex:0 0 auto; width:34px; height:34px; border-radius:8px; border:1px solid #ccc; background:#fff;
    font-size:12px; font-weight:600; cursor:pointer;
  }
  .jumpbar button.active{background:var(--fg); color:#fff; border-color:var(--fg);}
</style>
</head>
<body>

<header>
  <div>
    <div class="title" id="headerTitle">MP Vyapam Maths</div>
    <div class="sub" id="headerSub">Revision — tap to answer</div>
  </div>
  <button class="home-btn" id="homeBtn">⌂ Home</button>
</header>

<main id="app"></main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Solution</h3>
    <div class="ans-line" id="modalAnswer"></div>
    <div class="sol-text" id="modalSol"></div>
    <button class="modal-close" id="modalCloseBtn">Close</button>
  </div>
</div>

<script>
const TRICKS = {
  ch01: ["a:b, b:c chain → multiply straight across, cancel common term to bridge ratios.", "Componendo-dividendo: (a+b)/(a-b)=(c+d)/(c-d) ⇒ a/b=c/d after cross-mult.", "Mean proportional of x,y = √(xy). Third proportional to a,b = b²/a. Fourth proportional to a,b,c = bc/a."],
  ch02: ["Alligation cross rule: cheap:dear = (dear−mean):(mean−cheap). Draw the X, cross-subtract.", "CP of mixture = SP/(1+profit%). Then alligate against known rates.", "For 2 vessels mixed to a target ratio: alligate on the FRACTION (not the ratio) of the key ingredient."],
  ch03: ["Man-days constant: M1×D1×H1/W1 = M2×D2×H2/W2 — plug and cross-multiply, always.", "'Double men, half work' chain: time × (men ratio inverse) × (work ratio).", "A:B efficiency from times: if A takes p days, B takes q days, efficiency ratio A:B = q:p (inverse of time)."],
  ch04: ["Combined time formula: pq/(p+q) for two workers p,q days each.", "Wages split exactly by rate-contribution, not by days worked — find each person's rate first.", "Pipe+drain: net rate = fill rate − drain rate. Negative net = tank empties, not fills.", "3-unknown work systems (A+B, B+C, C+A given): SUM all three, divide by 2, then subtract each pair to isolate one variable."],
  ch05: ["Speed unit flip: km/hr → m/s = ×5/18. m/s → km/hr = ×18/5. Memorize once, never recompute.", "Late/early arrival: D×(s2−s1)/(s1×s2) = time difference (in hours) — one formula covers every 'late by X, early by Y' variant.", "Same distance, two speeds → Avg speed = 2s1s2/(s1+s2) (harmonic mean, NOT arithmetic average)."],
  ch06: ["Crossing a POLE → train covers only its own length. Crossing a PLATFORM/BRIDGE → train covers (length+platform).", "Same direction → relative speed = difference. Opposite direction → relative speed = sum. Always convert to m/s first.", "Two unknowns (train length + speed): set up 2 equations from 2 crossing scenarios, subtract to eliminate speed or length."],
  ch07: ["Downstream = boat+stream. Upstream = boat−stream. Boat speed = avg of the two. Stream speed = half the difference.", "If only times/distances given (no speeds), form 2 equations in x=1/downstream, y=1/upstream — solve as linear system.", "Boat vs plane-with-wind are the SAME problem: wind=stream, still-air speed=boat speed."],
  ch08: ["Head-start race: 'A beats B by Xm in a race of L' means B covers only (L−X) while A covers L — build the ratio from there.", "Chain multiple races (A vs B, B vs C) by combining ratios through the shared runner, just like ratio-chaining in Ch.1.", "Circular meeting time = LCM of individual lap times. Opposite-direction crossings use combined speed; same-direction 'meet again' uses LCM of lap times directly."],
  ch09: ["Ratio-now → equation-later: let ages = 4k,5k (etc); write the FUTURE/PAST ratio as a second equation, cross-multiply, solve for k.", "Sum-and-ratio combo: if sum is given directly, skip the ratio variable — solve sum equations first, it's faster.", "Average-age tricks: total age = avg×count. Swapping people in/out: new_sum = old_sum − leaving + joining, then re-average."],
  ch10: ["Percentage change chain: successive % changes multiply as factors — (1±p1)(1±p2)... — never just add/subtract %.", "A vs B vs C chains (income/weight/price): fix the FIRST person =100, cascade forward, read off the final ratio directly.", "'x% less than' vs 'x% more than' are NOT mirror images: if A is p% more than B, B is NOT p% less than A — recompute from the actual values."],
  ch11: ["Profit/loss stated 'on SP' is NOT the same as 'on CP' — always convert: if loss is x% of SP, actual loss% (on CP) = x/(100-x)×100... derive fresh each time, don't assume.", "Round-trip resale (A sells to B, B sells back to A): compute each SP as a real cash flow and net them — don't just subtract the two percentages.", "Weighted-average profit (goods sold in parts at different %): overall% = Σ(fraction×individual%) — treat it exactly like an alligation/average problem.", "'Buy cheaper + sell dearer changes profit%' problems: always set up TWO equations (original & modified scenario) in the SAME variable (CP), then subtract."],
  ch12: ["Successive discounts d1%,d2%,... → net retained fraction = product of (1-d1/100)(1-d2/100)... — never add discounts directly.", "MP → CP link: CP = MP×(1+markup%) is backwards from what most assume — re-derive from the problem's own wording each time, don't default to CP=MP.", "'Discount% vs profit%' mixed problems: fix MP=100, walk through CP and SP step by step; abstract formulas fail fast here."],
  ch13: ["'Money becomes n× itself in t years at SI' → SI=(n-1)P. Then Rate = (n-1)×100/t, or Time = (n-1)×100/R — pick whichever is asked.", "'Becomes A× in t1 years, find time for B× ' (same rate): time scales directly with the SI multiple → t2 = t1×(B-1)/(A-1).", "Ratio P:SI or P:Amount problems: convert directly to SI=P×R×T/100 and solve for the missing piece — don't hunt for a shortcut formula that doesn't exist."],
  ch14: ["'Becomes n× itself at CI in t years' → (1+r/100)^t = n. Take the nth root or recognize perfect powers (1.2²=1.44, 1.2³=1.728) instantly.", "Semi-annual/quarterly compounding: divide rate by periods-per-year, multiply time by periods-per-year — then treat it as a normal CI problem.", "SI given, CI asked (or vice-versa) at SAME rate/time: extract the rate from SI first (R=100×SI/(P×T)), THEN compute CI fresh — never guess a shortcut ratio between them for 3+ years.", "CI - SI relationship for 2 years only: CI-SI = P×(R/100)². This shortcut does NOT extend cleanly to 3 years — recompute directly instead."],
  ch15: ["Average of consecutive numbers (AP) = middle term (odd count) or average of the two middle terms (even count) — never sum-and-divide by hand.", "Average of numbers divisible by k in a range = (first + last)/2 — first and last are the nearest multiples of k inside the range.", "When one group's average and a merged group's average are both given, use: unknown = (merged sum) - (known sum) — set up the sum equations, not the averages, to solve."],
  ch16: ["AP: nth term=a+(n-1)d. Sum=n/2×(2a+(n-1)d)=n/2×(first+last). Know both forms cold.", "GP: nth term=ar^(n-1). Product of first n terms=(ar^((n-1)/2))^n — or just multiply out for small n.", "HP: convert to the RECIPROCAL sequence (which is an AP), solve there, then flip back at the end. Never manipulate HP terms directly."],
  ch17: ["Cyclic-exponent identities [(x^a/x^b)^(a+b)×...] almost always collapse to 1 — expand the exponent sum symbolically before crunching numbers.", "Nested infinite radical √(x+k√(x+k√...))=x → solve x=√(x+kx), square both sides, factor.", "Telescoping series 1/(n(n+d)): split into (1/d)[1/n - 1/(n+d)], sum collapses to just first-minus-last term.", "Surd rationalization: multiply by the conjugate FIRST, always — don't try to simplify nested surds by inspection."],
  ch18: ["x+1/x family: know the ladder cold — (x+1/x)²-2=x²+1/x²; cube the base to jump to x³+1/x³=q³-3q; square x²+1/x² term to reach x⁴+1/x⁴.", "a+b+c=0 is a MASTER key: it forces a³+b³+c³=3abc every time — spot this condition and the identity collapses instantly.", "Sum-of-squares-equals-zero trick: (expr1)²+(expr2)²+...=0 means EACH bracket=0 individually — regroup the given equation into perfect squares first.", "a-b type substitution: when a question gives a shifted variable (x-5, x-a, x+4), substitute y=that expression and solve the y-ladder — don't work in x directly."],
  ch19: ["Root-relation shortcuts: sum=−b/a, product=c/a. α²+β²=(sum)²−2(product). α/β+β/α=(sum²−2product)/product.", "Remainder theorem: to find remainder of p(x)÷(x−k), just compute p(k) — never do long division.", "Equal roots ⟺ discriminant=0. Set B²−4AC=0 and solve for the unknown directly.", "GCD of two cubics: factor each fully first (try small integer roots via the remainder theorem), then compare factor lists."],
  ch20: ["Consecutive-number word problems: let the MIDDLE term = x (for odd count) — sum simplifies instantly to (count)×x.", "Sum & product given, need difference: (a-b)²=(a+b)²-4ab — never solve the quadratic by hand when this shortcut works.", "Nearest perfect square: find √N, round to nearest integer k, then compare k² to N directly for add/subtract amount.", "Co-prime numbers: LCM×HCF=product always holds, and HCF=1 for co-primes, so LCM=product directly."],
  ch21: ["For algebraic terms, LCM takes the HIGHEST power of each variable; HCF takes the LOWEST power — never mix these up.", "LCM/HCF of fractions: LCM=LCM(numerators)/HCF(denominators); HCF=HCF(numerators)/LCM(denominators). Memorize both directions.", "'Bells ring together again' = LCM of the intervals. 'How many times in T minutes' = T/LCM + 1 (the +1 counts the start).", "'Same remainder' problems: subtract pairs of numbers first, then find the HCF of those DIFFERENCES — never the HCF of the numbers themselves."],
  ch22: ["Interior+Exterior angle of a regular polygon always sum to 180°. Exterior angle=360/n. Get one, get both instantly.", "Sum of interior angles=(n-2)×180°. Use this to jump straight from 'angle ratio' to 'find n' problems.", "Complement=90-x, Supplement=180-x. Read the question word-for-word — mixing these two is the #1 error source in this chapter.", "Triangle inequality: the sum of any two sides > third side, and the difference of any two sides < third side — use both together to bound unknown integer sides."],
};

const CHAPTERS = [
  {id:"ch01", name:"01 · Ratio & Proportion", file:"ch01.json"},
  {id:"ch02", name:"02 · Mixtures & Alligation", file:"ch02.json"},
  {id:"ch03", name:"03 · Chain Rule", file:"ch03.json"},
  {id:"ch04", name:"04 · Time & Work (100 Q, gap 95-103)", file:"ch04.json"},
  {id:"ch05", name:"05 · Time, Speed & Distance", file:"ch05.json"},
  {id:"ch06", name:"06 · Train", file:"ch06.json"},
  {id:"ch07", name:"07 · Boat & Stream", file:"ch07.json"},
  {id:"ch08", name:"08 · Race", file:"ch08.json"},
  {id:"ch09", name:"09 · Ages", file:"ch09.json"},
  {id:"ch10", name:"10 · Percentage", file:"ch10.json"},
  {id:"ch11", name:"11 · Profit & Loss", file:"ch11.json"},
  {id:"ch12", name:"12 · Discount", file:"ch12.json"},
  {id:"ch13", name:"13 · Simple Interest", file:"ch13.json"},
  {id:"ch14", name:"14 · Compound Interest", file:"ch14.json"},
  {id:"ch15", name:"15 · Average", file:"ch15.json"},
  {id:"ch16", name:"16 · AP, GP & HP", file:"ch16.json"},
  {id:"ch17", name:"17 · Simplification", file:"ch17.json"},
  {id:"ch18", name:"18 · Algebra", file:"ch18.json"},
  {id:"ch19", name:"19 · Equations", file:"ch19.json"},
  {id:"ch20", name:"20 · Number System", file:"ch20.json"},
  {id:"ch21", name:"21 · LCM & HCF", file:"ch21.json"},
  {id:"ch22", name:"22 · Geometry", file:"ch22.json"},
  {id:"ch23", name:"23 · Mensuration I", file:null},
  {id:"ch24", name:"24 · Mensuration II", file:null},
  {id:"ch25", name:"25 · Trigonometry", file:null},
  {id:"ch26", name:"26 · Permutation & Combination", file:null},
  {id:"ch27", name:"27 · Probability", file:null},
  {id:"ch28", name:"28 · Statistics", file:null},
];

let state = { view:"home", chapter:null, qIndex:0, questions:[], selected:{} };
const app = document.getElementById("app");
const headerTitle = document.getElementById("headerTitle");
const headerSub = document.getElementById("headerSub");

document.getElementById("homeBtn").onclick = () => { state.view="home"; render(); };
document.getElementById("modalCloseBtn").onclick = closeModal;
document.getElementById("modalOverlay").onclick = (e)=>{ if(e.target.id==="modalOverlay") closeModal(); };

function closeModal(){ document.getElementById("modalOverlay").classList.remove("show"); }
function openModal(title, ansHtml, solText){
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalAnswer").innerHTML = ansHtml;
  document.getElementById("modalSol").textContent = solText;
  document.getElementById("modalOverlay").classList.add("show");
}

async function openChapter(ch){
  if(!ch.file){ return; }
  if(!ch._data){
    try{
      const res = await fetch(ch.file);
      ch._data = await res.json();
    }catch(e){
      alert("Could not load chapter data.");
      return;
    }
  }
  state.view="quiz";
  state.chapter=ch;
  state.qIndex=0;
  state.questions=ch._data;
  state.selected={};
  render();
}

function renderHome(){
  headerTitle.textContent = "MP Vyapam Maths";
  headerSub.textContent = "28 chapters · tap a topic";
  let html = '<div class="chapter-list">';
  CHAPTERS.forEach((ch,i)=>{
    if(ch.file){
      html += `<div class="chapter-item" data-idx="${i}"><span class="cname">${ch.name}</span><span class="ccount">open →</span></div>`;
    }else{
      html += `<div class="chapter-item disabled"><span class="cname">${ch.name}</span><span class="ccount">coming soon</span></div>`;
    }
  });
  html += '</div>';
  app.innerHTML = html;
  app.querySelectorAll(".chapter-item[data-idx]").forEach(el=>{
    el.onclick = ()=> openChapter(CHAPTERS[+el.dataset.idx]);
  });
}

function renderQuiz(){
  const ch = state.chapter;
  const qs = state.questions;
  const i = state.qIndex;
  const q = qs[i];
  headerTitle.textContent = ch.name;
  headerSub.textContent = `Question ${i+1} of ${qs.length}`;

  const pct = Math.round(((i+1)/qs.length)*100);
  const sel = state.selected[q.id];

  let optsHtml = "";
  q.opts.forEach((opt,idx)=>{
    if(!opt || opt==="–"){ return; }
    let cls="opt";
    if(sel!==undefined){
      if(idx===q.ans) cls+=" correct";
      else if(idx===sel) cls+=" selected-wrong";
    }
    optsHtml += `<div class="${cls}" data-idx="${idx}"><span class="lab">${String.fromCharCode(65+idx)}.</span><span>${opt}</span></div>`;
  });

  let jump = '<div class="jumpbar">';
  qs.forEach((qq,idx)=>{
    jump += `<button class="${idx===i?'active':''}" data-jump="${idx}">${idx+1}</button>`;
  });
  jump += '</div>';

  app.innerHTML = `
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    ${jump}
    <div class="qcard">
      <div class="qtext">${q.q}</div>
      ${optsHtml}
    </div>
    <div class="actions">
      <button id="showAnsBtn">Show Answer</button>
      <button id="showSolBtn" class="primary">Show Solution</button>
    </div>
    ${TRICKS[ch.id] ? '<div class="actions" style="margin-top:8px;"><button id="showTricksBtn">💡 Chapter Tricks</button></div>' : ''}
    <div class="navbar">
      <button id="prevBtn" ${i===0?"disabled":""}>‹ Prev</button>
      <button id="nextBtn" ${i===qs.length-1?"disabled":""}>Next ›</button>
    </div>
  `;

  app.querySelectorAll(".opt[data-idx]").forEach(el=>{
    el.onclick = ()=>{
      state.selected[q.id] = +el.dataset.idx;
      renderQuiz();
    };
  });
  app.querySelectorAll("[data-jump]").forEach(el=>{
    el.onclick = ()=>{ state.qIndex = +el.dataset.jump; renderQuiz(); };
  });
  document.getElementById("prevBtn").onclick = ()=>{ if(state.qIndex>0){ state.qIndex--; renderQuiz(); } };
  document.getElementById("nextBtn").onclick = ()=>{ if(state.qIndex<qs.length-1){ state.qIndex++; renderQuiz(); } };
  document.getElementById("showAnsBtn").onclick = ()=>{
    const letter = String.fromCharCode(65+q.ans);
    openModal(`Answer — Q${i+1}`, `<b>Correct: (${letter}) ${q.opts[q.ans]}</b>`, "Tap 'Show Solution' for the fast method.");
  };
  document.getElementById("showSolBtn").onclick = ()=>{
    const letter = String.fromCharCode(65+q.ans);
    openModal(`Solution — Q${i+1}`, `<b>Answer: (${letter}) ${q.opts[q.ans]}</b>`, q.sol || "Solution not available.");
  };
  const tricksBtn = document.getElementById("showTricksBtn");
  if(tricksBtn){
    tricksBtn.onclick = ()=>{
      const tips = TRICKS[ch.id] || [];
      const html = tips.map((t,idx)=>`${idx+1}. ${t}`).join("\n\n");
      openModal(`${ch.name} — Shortcuts`, "", html);
    };
  }
}

function render(){
  if(state.view==="home") renderHome();
  else renderQuiz();
  window.scrollTo(0,0);
}

render();
</script>
</body>
</html>
