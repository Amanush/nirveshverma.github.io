<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Reels</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:#000;font-family:-apple-system,"Segoe UI","Noto Sans Devanagari",Arial,sans-serif}
body{min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:460px;padding:14px 16px 24px;display:flex;flex-direction:column;min-height:100vh}
button{font-family:inherit;cursor:pointer}
h1{font-size:22px;margin:6px 0 4px}
.sub{font-size:13px;color:#555;margin-bottom:14px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;border:2px solid #000;border-radius:10px;padding:16px;background:#fff;color:#000;font-size:19px;font-weight:600;text-align:left}
.item:active{background:#000;color:#fff}
.item .c{font-size:13px;border:1.5px solid currentColor;border-radius:12px;padding:2px 10px;font-weight:500}
.item.off{opacity:.35;pointer-events:none}
.item.dark{background:#000;color:#fff}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.sm{border:1.5px solid #000;background:#fff;color:#000;border-radius:6px;padding:5px 11px;font-size:13px}
.sm.on{background:#000;color:#fff}
.meta{font-size:13px;color:#555}
#quiz{display:none;flex:1;flex-direction:column}
.tag{align-self:flex-start;font-size:12px;border:1.5px solid #000;border-radius:12px;padding:2px 10px;margin:8px 0}
.q{border:3px solid #000;border-radius:14px;padding:20px 16px;font-weight:700;line-height:1.38;min-height:170px;display:flex;align-items:center;word-break:break-word}
.hint{min-height:58px;margin-top:12px;border:2.5px dashed #000;border-radius:12px;padding:10px;text-align:center;font-weight:800;letter-spacing:4px;font-size:24px;display:flex;flex-direction:column;justify-content:center;visibility:hidden;word-break:break-word}
.hint small{font-size:11px;letter-spacing:1.5px;font-weight:600;color:#555;margin-bottom:2px}
.mid{min-height:140px;display:flex;align-items:center;justify-content:center;margin:12px 0}
.ring{position:relative;width:110px;height:110px}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800}
#showBtn{display:none;width:100%;padding:18px;font-size:22px;font-weight:700;background:#000;color:#fff;border:3px solid #000;border-radius:12px}
.ans{display:none;width:100%;border:3px solid #000;border-radius:14px;padding:18px;background:#f0f0f0;font-weight:800;line-height:1.35;text-align:center;word-break:break-word}
.ans small{display:block;font-size:12px;letter-spacing:1px;color:#555;margin-bottom:6px}
.nav{display:flex;gap:10px;margin-top:6px;padding-top:10px}
.nav button{flex:1;padding:15px;font-size:18px;font-weight:600;border:2px solid #000;border-radius:10px;background:#fff;color:#000}
.nav button:active:not(:disabled){background:#000;color:#fff}
.nav button:disabled{opacity:.25}
#err{color:#b00;font-size:12px;margin-top:10px}
.set{margin-top:22px;border-top:2px solid #000;padding-top:12px}
.set h2{font-size:14px;margin:0 0 8px;letter-spacing:1px}
.row{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:15px;gap:8px}
.seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
</style>
</head>
<body>
<div id="app">

<div id="home">
  <h1>Quiz Reels</h1>
  <div class="sub">Pick a subject</div>
  <div class="list" id="subjects"></div>
  <div class="set">
    <h2>SETTINGS</h2>
    <div class="row"><span>Timer (sec)</span><div class="seg" id="sTimer"></div></div>
    <div class="row"><span>Hint</span><div class="seg" id="sHint"></div></div>
    <div class="row"><span>Voice reads question</span><div class="seg" id="sVoice"></div></div>
    <div class="row"><span>Tick sound</span><div class="seg" id="sBeep"></div></div>
    <div class="row"><span>Auto-play (reveal + next)</span><div class="seg" id="sAuto"></div></div>
  </div>
</div>

<div id="topics" style="display:none">
  <div class="bar"><button class="sm" onclick="showHome()">← Home</button><span class="meta" id="tSubj"></span></div>
  <div class="sub">Pick a topic, or play everything</div>
  <div class="list" id="topicList"></div>
</div>

<div id="quiz">
  <div class="bar">
    <button class="sm" onclick="showTopics()">← Back</button>
    <span class="meta" id="prog"></span>
    <button class="sm" id="shufBtn" onclick="toggleShuffle()">Shuffle</button>
  </div>
  <div class="tag" id="tag"></div>
  <div class="q" id="qText"></div>
  <div class="hint" id="hint"></div>
  <div class="mid">
    <div class="ring" id="ring">
      <svg width="110" height="110"><circle cx="55" cy="55" r="48" fill="none" stroke="#ddd" stroke-width="9"/><circle id="arc" cx="55" cy="55" r="48" fill="none" stroke="#000" stroke-width="9" stroke-dasharray="301.6" stroke-dashoffset="0"/></svg>
      <div class="n" id="num">10</div>
    </div>
    <button id="showBtn" onclick="reveal()">Show me answer</button>
    <div class="ans" id="ans"><small>ANSWER</small><span id="ansT"></span></div>
  </div>
  <div class="nav">
    <button id="prev" onclick="step(-1)">← Previous</button>
    <button id="next" onclick="step(1)">Next →</button>
  </div>
</div>

<div id="err"></div>
</div>

<script>
const DEF = {secs: 7, hint: 'auto', voice: false, beep: true, auto: false};
let CFG = Object.assign({}, DEF);
try { Object.assign(CFG, JSON.parse(localStorage.getItem('qr_cfg') || '{}')); } catch (e) {}
const saveCfg = () => { try { localStorage.setItem('qr_cfg', JSON.stringify(CFG)); } catch (e) {} };

let MAN = [], CACHE = {}, subj = null, pool = [], set = [], i = 0, tmr = null, aux = null, shuffle = false, AC = null;
const $ = id => document.getElementById(id);
const norm = d => (Array.isArray(d) ? d : (d.questions || [])).map(x => ({q: x.q, a: String(x.a), t: x.t || x.topic || 'General'})).filter(x => x.q && x.a);
const G = s => (window.Intl && Intl.Segmenter) ? Array.from(new Intl.Segmenter(undefined, {granularity: 'grapheme'}).segment(s), x => x.segment) : Array.from(s);

/* ---------- settings ---------- */
function seg(id, key, opts) {
  const box = $(id); box.innerHTML = '';
  opts.forEach(([label, val]) => {
    const b = document.createElement('button'); b.className = 'sm' + (CFG[key] === val ? ' on' : ''); b.textContent = label;
    b.onclick = () => { CFG[key] = val; saveCfg(); seg(id, key, opts); };
    box.appendChild(b);
  });
}
function buildSettings() {
  seg('sTimer', 'secs', [['5', 5], ['7', 7], ['10', 10], ['15', 15]]);
  seg('sHint', 'hint', [['Off', 'off'], ['Auto', 'auto'], ['Mask', 'mask'], ['Jumble', 'jumble']]);
  seg('sVoice', 'voice', [['Off', false], ['On', true]]);
  seg('sBeep', 'beep', [['Off', false], ['On', true]]);
  seg('sAuto', 'auto', [['Off', false], ['On', true]]);
}

/* ---------- init / screens ---------- */
async function init() {
  buildSettings();
  try { MAN = await (await fetch('manifest.json')).json(); } catch (e) { $('err').textContent = 'Serve this folder via a web server. ' + e; return; }
  await Promise.all(MAN.map(async m => {
    try { CACHE[m.id] = norm(await (await fetch(m.file)).json()); } catch (e) { CACHE[m.id] = []; }
    m.count = CACHE[m.id].length;
  }));
  showHome();
}
function show(id) { ['home','topics'].forEach(x => $(x).style.display = x === id ? 'block' : 'none'); $('quiz').style.display = id === 'quiz' ? 'flex' : 'none'; }
function showHome() {
  stop(); show('home'); $('subjects').innerHTML = '';
  MAN.forEach(m => {
    const b = document.createElement('button'); b.className = 'item' + (m.count ? '' : ' off');
    b.innerHTML = '<span>' + m.name + '</span><span class="c">' + (m.count || 'soon') + '</span>';
    b.onclick = () => pickSubject(m); $('subjects').appendChild(b);
  });
}
function pickSubject(m) { subj = m; pool = CACHE[m.id]; showTopics(); }
function showTopics() {
  stop(); show('topics'); $('tSubj').textContent = subj.name;
  const L = $('topicList'); L.innerHTML = '';
  const add = (name, n, cls, f) => { const b = document.createElement('button'); b.className = 'item ' + cls; b.innerHTML = '<span>' + name + '</span><span class="c">' + n + '</span>'; b.onclick = f; L.appendChild(b); };
  add('All questions', pool.length, 'dark', () => start(pool));
  const g = {}; pool.forEach(x => (g[x.t] = g[x.t] || []).push(x));
  Object.keys(g).sort((a, b) => g[b].length - g[a].length).forEach(t => add(t, g[t].length, '', () => start(g[t])));
}
function start(arr) {
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume(); } catch (e) {}
  set = shuffle ? shuf(arr) : arr.slice(); i = 0; show('quiz'); render();
}
function shuf(a) { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }
function toggleShuffle() { shuffle = !shuffle; $('shufBtn').classList.toggle('on', shuffle); set = shuffle ? shuf(set) : set; i = 0; render(); }

/* ---------- helpers ---------- */
function stop() { clearInterval(tmr); clearTimeout(aux); tmr = aux = null; try { speechSynthesis.cancel(); } catch (e) {} }
function beep(freq, dur) {
  if (!CFG.beep || !AC) return;
  try { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = freq; o.connect(g); g.connect(AC.destination); g.gain.setValueAtTime(0.15, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur); o.start(); o.stop(AC.currentTime + dur); } catch (e) {}
}
function speak(text, done) {
  if (!CFG.voice || !window.speechSynthesis) { done && done(); return; }
  let fired = false; const fin = () => { if (!fired) { fired = true; done && done(); } };
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = /[ऀ-ॿ]/.test(text) ? 'hi-IN' : 'en-IN'; u.rate = 0.95;
    u.onend = fin; u.onerror = fin; speechSynthesis.cancel(); speechSynthesis.speak(u);
    aux = setTimeout(fin, 20000);
  } catch (e) { fin(); }
}
function fit(el, text, big) {         // font size by text length
  const n = text.length;
  el.style.fontSize = (big ? (n <= 50 ? 34 : n <= 100 ? 30 : n <= 170 ? 26 : n <= 260 ? 22 : 19)
                           : (n <= 20 ? 34 : n <= 60 ? 28 : n <= 120 ? 24 : 20)) + 'px';
}
function makeHint(a) {
  const mode = CFG.hint; if (mode === 'off') return null;
  const words = a.trim().split(/\s+/), one = words.length === 1, g = G(a.trim());
  const jumbleOK = one && g.length >= 4 && g.length <= 12 && !/^[\d.,\/\-+%]+$/.test(a);
  if ((mode === 'jumble' || mode === 'auto') && jumbleOK) {
    let j = g, tries = 0; do { j = shuf(g); tries++; } while (j.join('') === g.join('') && tries < 10);
    return ['UNSCRAMBLE', j.join(' ')];
  }
  if (words.length <= 4 && g.length <= 28) {
    return [words.length + ' WORD' + (words.length > 1 ? 'S' : ''), words.map(w => { const x = G(w); return x[0] + ' ' + x.slice(1).map(() => '_').join(' '); }).join('  /  ')];
  }
  return [words.length + ' WORDS', 'STARTS WITH ' + G(words[0])[0]];
}

/* ---------- render ---------- */
function render() {
  stop();
  const q = set[i], S = CFG.secs;
  $('prog').textContent = (i + 1) + ' / ' + set.length;
  $('tag').textContent = subj.name + ' · ' + q.t;
  $('qText').textContent = q.q; fit($('qText'), q.q, true);
  $('ansT').textContent = q.a; fit($('ans'), q.a, false);
  const h = makeHint(q.a); $('hint').style.visibility = 'hidden';
  $('prev').disabled = i === 0; $('next').disabled = i === set.length - 1;
  $('ans').style.display = 'none'; $('showBtn').style.display = 'none'; $('ring').style.display = 'block';
  tick(S, S); window.scrollTo(0, 0);
  speak(q.q, () => {
    let t = S;
    tmr = setInterval(() => {
      t--; tick(t, S);
      if (t > 0) beep(t <= 3 ? 880 : 520, 0.08);
      if (h && t === Math.ceil(S / 2)) { $('hint').innerHTML = '<small>HINT · ' + h[0] + '</small>' + h[1]; $('hint').style.visibility = 'visible'; }
      if (t <= 0) {
        stop(); beep(300, 0.35); $('ring').style.display = 'none';
        if (CFG.auto) reveal(); else $('showBtn').style.display = 'block';
      }
    }, 1000);
  });
}
function tick(t, S) { $('num').textContent = t; $('arc').setAttribute('stroke-dashoffset', (301.6 * (1 - t / S)).toFixed(1)); }
function reveal() {
  $('showBtn').style.display = 'none'; $('ans').style.display = 'block'; $('hint').style.visibility = 'hidden';
  speak(set[i].a, () => { if (CFG.auto && i < set.length - 1) aux = setTimeout(() => step(1), 3500); });
}
function step(d) { const n = i + d; if (n >= 0 && n < set.length) { i = n; render(); } }
document.addEventListener('keydown', e => { if ($('quiz').style.display !== 'flex') return; if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); if (e.key === 'Enter' && $('showBtn').style.display === 'block') reveal(); });
init();
</script>

</body>
</html>
