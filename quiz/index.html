<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E8ECF4; --card:#fff; --ink:#0F1B3D; --ink2:#3A4768; --mute:#6B7792;
  --line:#D5DBE9; --red:#C8312B; --hi:#FFE27A;
  --r:18px;
  --shadow:0 1px 0 rgba(15,27,61,.04),0 10px 30px -12px rgba(15,27,61,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hind","Noto Sans Devanagari","Segoe UI",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:460px;padding:18px 18px 28px;display:flex;flex-direction:column;min-height:100vh}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* home */
.brand{display:flex;align-items:center;gap:10px;margin:4px 0 22px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--ink);display:grid;place-items:center}
.mark svg{display:block}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.2px}
h1{font-size:30px;line-height:1.1;margin:0 0 6px;font-weight:700;letter-spacing:-.6px}
.sub{font-size:16px;color:var(--mute);margin:0 0 20px}
.list{display:flex;flex-direction:column;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line);padding:18px 18px;background:transparent;font-size:19px;font-weight:600;text-align:left;width:100%;transition:background .15s}
.item:last-child{border-bottom:0}
.item:active{background:#F1F4FA}
.item span:first-child{flex:1}
.item .c{font-size:15px;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
.item::after{content:"";width:8px;height:8px;border-top:2px solid var(--mute);border-right:2px solid var(--mute);transform:rotate(45deg);margin-left:2px;flex:none}
.item.off{opacity:.4;pointer-events:none}
.item.dark{background:var(--ink);color:#fff}
.item.dark .c{color:#B9C3DE}
.item.dark::after{border-color:#B9C3DE}
.item.dark:active{background:#1B2A55}

.set{margin-top:22px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:6px 18px}
.set h2{font-size:13px;margin:14px 0 2px;color:var(--mute);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;font-size:16px;gap:10px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.seg{display:inline-flex;background:#EDF0F7;border-radius:10px;padding:3px;gap:2px}
.sm{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--ink2);transition:background .15s,color .15s}
.sm.on{background:var(--ink);color:#fff}

/* bars */
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.meta{font-size:15px;color:var(--mute);font-weight:500;font-variant-numeric:tabular-nums}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#topics .sub{margin-bottom:16px}

/* quiz */
#quiz{display:none;flex:1;flex-direction:column}
.track{height:4px;background:var(--line);border-radius:4px;margin:-4px 0 16px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--ink);border-radius:4px;transition:width .3s}
.paper{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:20px 20px 24px}
.tag{font-size:14px;color:var(--mute);font-weight:500;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag b{background:var(--ink);color:#fff;border-radius:6px;padding:1px 9px;font-weight:600;font-size:13px}
.q{font-weight:700;line-height:1.38;letter-spacing:-.2px;min-height:150px;display:flex;align-items:center;word-break:break-word;color:var(--ink)}
.hint{min-height:0;margin-top:14px;padding:11px 14px;border-radius:12px;background:var(--hi);text-align:center;font-weight:700;letter-spacing:5px;font-size:24px;display:none;word-break:break-word;animation:pop .25s ease-out}
.hint.show{display:block}
.hint small{display:block;font-size:13px;letter-spacing:0;font-weight:600;color:#6B5A00;margin-bottom:2px}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}

.mid{min-height:150px;display:flex;align-items:center;justify-content:center;margin:16px 0 8px}
.ring{position:relative;width:116px;height:116px}
.ring svg{transform:rotate(-90deg);display:block}
.ring .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px}
#arc{stroke:var(--ink);transition:stroke-dashoffset 1s linear,stroke .2s}
.ring.urgent #arc{stroke:var(--red)}
.ring.urgent .n{color:var(--red)}
#showBtn{display:none;width:100%;padding:19px;font-size:21px;font-weight:700;background:var(--ink);color:#fff;border:0;border-radius:16px;box-shadow:0 12px 24px -12px rgba(15,27,61,.6)}
#showBtn:active{transform:translateY(1px)}
.ans{display:none;width:100%;border-radius:18px;padding:20px 18px 22px;background:var(--ink);color:#fff;font-weight:700;line-height:1.35;text-align:center;word-break:break-word;animation:pop .25s ease-out}
.ans small{display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:600;color:#9FE3B8;margin-bottom:8px}
.ans small::before{content:"";width:12px;height:7px;border-left:3px solid #9FE3B8;border-bottom:3px solid #9FE3B8;transform:rotate(-45deg) translateY(-2px)}

.nav{display:flex;gap:10px;margin-top:10px}
.nav button{flex:1;padding:16px;font-size:18px;font-weight:600;border:0;border-radius:14px;background:var(--card);box-shadow:var(--shadow);transition:transform .1s}
.nav button:active:not(:disabled){transform:translateY(1px);background:#F1F4FA}
.nav #next{background:var(--ink);color:#fff}
.nav button:disabled{opacity:.35;box-shadow:none}
#err{color:var(--red);font-size:13px;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">

<div id="home">
  <div class="brand"><div class="mark"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 9.5l4 4 8-9" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><b>Daily Quiz</b></div>
  <h1>Choose a subject</h1>
  <p class="sub">Pick one to start recording.</p>
  <div class="list" id="subjects"></div>
  <div class="set">
    <h2>Recording settings</h2>
    <div class="row"><span>Timer, seconds</span><div class="seg" id="sTimer"></div></div>
    <div class="row"><span>Hint</span><div class="seg" id="sHint"></div></div>
    <div class="row"><span>Voice reads question</span><div class="seg" id="sVoice"></div></div>
    <div class="row"><span>Tick sound</span><div class="seg" id="sBeep"></div></div>
    <div class="row"><span>Auto-play</span><div class="seg" id="sAuto"></div></div>
  </div>
</div>

<div id="topics" style="display:none">
  <div class="bar"><button class="pill" onclick="showHome()">Back</button><span class="meta" id="tSubj"></span></div>
  <h1>Choose a topic</h1>
  <p class="sub">Or play every question.</p>
  <div class="list" id="topicList"></div>
</div>

<div id="quiz">
  <div class="bar">
    <button class="pill" onclick="showTopics()">Back</button>
    <span class="meta" id="prog"></span>
    <button class="pill" id="shufBtn" onclick="toggleShuffle()">Shuffle</button>
  </div>
  <div class="track"><i id="trk"></i></div>
  <div class="paper">
    <div class="tag" id="tag"></div>
    <div class="q" id="qText"></div>
    <div class="hint" id="hint"></div>
    <div class="mid">
      <div class="ring" id="ring">
        <svg width="116" height="116"><circle cx="58" cy="58" r="51" fill="none" stroke="#E4E9F3" stroke-width="8"/><circle id="arc" cx="58" cy="58" r="51" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="320.4" stroke-dashoffset="0"/></svg>
        <div class="n" id="num">7</div>
      </div>
      <button id="showBtn" onclick="reveal()">Show me answer</button>
      <div class="ans" id="ans"><small>Answer</small><span id="ansT"></span></div>
    </div>
  </div>
  <div class="nav">
    <button id="prev" onclick="step(-1)">Previous</button>
    <button id="next" onclick="step(1)">Next</button>
  </div>
</div>

<div id="err"></div>
</div>

<script>
const DEF = {secs: 7, hint: 'auto', voice: false, beep: true, auto: false};
let CFG = Object.assign({}, DEF);
try { Object.assign(CFG, JSON.parse(localStorage.getItem('qr_cfg') || '{}')); } catch (e) {}
const saveCfg = () => { try { localStorage.setItem('qr_cfg', JSON.stringify(CFG)); } catch (e) {} };

let MAN = [], CACHE = {}, subj = null, pool = [], set = [], i = 0, tmr = null, aux = null, shuffle = false, AC = null;
const $ = id => document.getElementById(id);
const norm = d => (Array.isArray(d) ? d : (d.questions || [])).map(x => ({q: x.q, a: String(x.a), t: x.t || x.topic || 'General'})).filter(x => x.q && x.a);
const G = s => (window.Intl && Intl.Segmenter) ? Array.from(new Intl.Segmenter(undefined, {granularity: 'grapheme'}).segment(s), x => x.segment) : Array.from(s);

/* ---------- settings ---------- */
function seg(id, key, opts) {
  const box = $(id); box.innerHTML = '';
  opts.forEach(([label, val]) => {
    const b = document.createElement('button'); b.className = 'sm' + (CFG[key] === val ? ' on' : ''); b.textContent = label;
    b.onclick = () => { CFG[key] = val; saveCfg(); seg(id, key, opts); };
    box.appendChild(b);
  });
}
function buildSettings() {
  seg('sTimer', 'secs', [['5', 5], ['7', 7], ['10', 10], ['15', 15]]);
  seg('sHint', 'hint', [['Off', 'off'], ['Auto', 'auto'], ['Mask', 'mask'], ['Jumble', 'jumble']]);
  seg('sVoice', 'voice', [['Off', false], ['On', true]]);
  seg('sBeep', 'beep', [['Off', false], ['On', true]]);
  seg('sAuto', 'auto', [['Off', false], ['On', true]]);
}

/* ---------- init / screens ---------- */
async function init() {
  buildSettings();
  try { MAN = await (await fetch('manifest.json')).json(); } catch (e) { $('err').textContent = 'Serve this folder via a web server. ' + e; return; }
  await Promise.all(MAN.map(async m => {
    try { CACHE[m.id] = norm(await (await fetch(m.file)).json()); } catch (e) { CACHE[m.id] = []; }
    m.count = CACHE[m.id].length;
  }));
  showHome();
}
function show(id) { ['home','topics'].forEach(x => $(x).style.display = x === id ? 'block' : 'none'); $('quiz').style.display = id === 'quiz' ? 'flex' : 'none'; }
function showHome() {
  stop(); show('home'); $('subjects').innerHTML = '';
  MAN.forEach(m => {
    const b = document.createElement('button'); b.className = 'item' + (m.count ? '' : ' off');
    b.innerHTML = '<span>' + m.name + '</span><span class="c">' + (m.count || 'soon') + '</span>';
    b.onclick = () => pickSubject(m); $('subjects').appendChild(b);
  });
}
function pickSubject(m) { subj = m; pool = CACHE[m.id]; showTopics(); }
function showTopics() {
  stop(); show('topics'); $('tSubj').textContent = subj.name;
  const L = $('topicList'); L.innerHTML = '';
  const add = (name, n, cls, f) => { const b = document.createElement('button'); b.className = 'item ' + cls; b.innerHTML = '<span>' + name + '</span><span class="c">' + n + '</span>'; b.onclick = f; L.appendChild(b); };
  add('All questions', pool.length, 'dark', () => start(pool));
  const g = {}; pool.forEach(x => (g[x.t] = g[x.t] || []).push(x));
  Object.keys(g).sort((a, b) => g[b].length - g[a].length).forEach(t => add(t, g[t].length, '', () => start(g[t])));
}
function start(arr) {
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume(); } catch (e) {}
  set = shuffle ? shuf(arr) : arr.slice(); i = 0; show('quiz'); render();
}
function shuf(a) { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }
function toggleShuffle() { shuffle = !shuffle; $('shufBtn').classList.toggle('on', shuffle); set = shuffle ? shuf(set) : set; i = 0; render(); }

/* ---------- helpers ---------- */
function stop() { clearInterval(tmr); clearTimeout(aux); tmr = aux = null; try { speechSynthesis.cancel(); } catch (e) {} }
function beep(freq, dur) {
  if (!CFG.beep || !AC) return;
  try { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = freq; o.connect(g); g.connect(AC.destination); g.gain.setValueAtTime(0.15, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur); o.start(); o.stop(AC.currentTime + dur); } catch (e) {}
}
function speak(text, done) {
  if (!CFG.voice || !window.speechSynthesis) { done && done(); return; }
  let fired = false; const fin = () => { if (!fired) { fired = true; done && done(); } };
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = /[ऀ-ॿ]/.test(text) ? 'hi-IN' : 'en-IN'; u.rate = 0.95;
    u.onend = fin; u.onerror = fin; speechSynthesis.cancel(); speechSynthesis.speak(u);
    aux = setTimeout(fin, 20000);
  } catch (e) { fin(); }
}
function fit(el, text, big) {         // font size by text length
  const n = text.length;
  el.style.fontSize = (big ? (n <= 50 ? 34 : n <= 100 ? 30 : n <= 170 ? 26 : n <= 260 ? 22 : 19)
                           : (n <= 20 ? 34 : n <= 60 ? 28 : n <= 120 ? 24 : 20)) + 'px';
}
function makeHint(a) {
  const mode = CFG.hint; if (mode === 'off') return null;
  const words = a.trim().split(/\s+/), one = words.length === 1, g = G(a.trim());
  const jumbleOK = one && g.length >= 4 && g.length <= 12 && !/^[\d.,\/\-+%]+$/.test(a);
  if ((mode === 'jumble' || mode === 'auto') && jumbleOK) {
    let j = g, tries = 0; do { j = shuf(g); tries++; } while (j.join('') === g.join('') && tries < 10);
    return ['UNSCRAMBLE', j.join(' ')];
  }
  if (words.length <= 4 && g.length <= 28) {
    return [words.length + ' WORD' + (words.length > 1 ? 'S' : ''), words.map(w => { const x = G(w); return x[0] + ' ' + x.slice(1).map(() => '_').join(' '); }).join('  /  ')];
  }
  return [words.length + ' WORDS', 'STARTS WITH ' + G(words[0])[0]];
}

/* ---------- render ---------- */
function render() {
  stop();
  const q = set[i], S = CFG.secs;
  $('prog').textContent = (i + 1) + ' / ' + set.length;
  $('tag').innerHTML = '<b>' + subj.name + '</b><span></span>'; $('tag').lastChild.textContent = q.t;
  $('qText').textContent = q.q; fit($('qText'), q.q, true);
  $('ansT').textContent = q.a; fit($('ans'), q.a, false);
  const h = makeHint(q.a); $('hint').classList.remove('show');
  $('ring').classList.remove('urgent'); $('trk').style.width = ((i + 1) / set.length * 100) + '%';
  $('prev').disabled = i === 0; $('next').disabled = i === set.length - 1;
  $('ans').style.display = 'none'; $('showBtn').style.display = 'none'; $('ring').style.display = 'block';
  tick(S, S); window.scrollTo(0, 0);
  speak(q.q, () => {
    let t = S;
    tmr = setInterval(() => {
      t--; tick(t, S);
      if (t <= 3 && t > 0) $('ring').classList.add('urgent');
      if (t > 0) beep(t <= 3 ? 880 : 520, 0.08);
      if (h && t === Math.ceil(S / 2)) { $('hint').innerHTML = '<small>Hint: ' + h[0].toLowerCase() + '</small>'; $('hint').appendChild(document.createTextNode(h[1])); $('hint').classList.add('show'); }
      if (t <= 0) {
        stop(); beep(300, 0.35); $('ring').style.display = 'none';
        if (CFG.auto) reveal(); else $('showBtn').style.display = 'block';
      }
    }, 1000);
  });
}
function tick(t, S) { $('num').textContent = t; $('arc').setAttribute('stroke-dashoffset', (320.4 * (1 - t / S)).toFixed(1)); }
function reveal() {
  $('showBtn').style.display = 'none'; $('ans').style.display = 'block'; $('hint').classList.remove('show');
  speak(set[i].a, () => { if (CFG.auto && i < set.length - 1) aux = setTimeout(() => step(1), 3500); });
}
function step(d) { const n = i + d; if (n >= 0 && n < set.length) { i = n; render(); } }
document.addEventListener('keydown', e => { if ($('quiz').style.display !== 'flex') return; if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); if (e.key === 'Enter' && $('showBtn').style.display === 'block') reveal(); });
init();
</script>
</body>
</html>
