<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Thread → Shorts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Playfair+Display:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow-x: hidden; }
    
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--app-bg, #0f172a);
      color: var(--app-text, #f8fafc);
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.3s, color 0.3s;
    }
    
    :root {
      --app-bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #3b82f6;
      --slide-bg: #1e293b;
      --slide-text: #f1f5f9;
      --muted: #94a3b8;
    }
    
    /* Themes */
    body.theme-light {
      --app-bg: #f4f2ef;
      --card-bg: #ffffff;
      --border: #e7e5e4;
      --accent: #3b82f6;
      --slide-bg: #ffffff;
      --slide-text: #1c1917;
      --muted: #78716c;
    }
    body.theme-midnight {
      --app-bg: #0a0a0f;
      --card-bg: #12121a;
      --border: #1f1f2e;
      --accent: #8b5cf6;
      --slide-bg: #12121a;
      --slide-text: #f5f3ff;
      --muted: #a78bfa;
    }
    body.theme-warm {
      --app-bg: #1c1917;
      --card-bg: #292524;
      --border: #44403c;
      --accent: #f59e0b;
      --slide-bg: #292524;
      --slide-text: #fafaf9;
      --muted: #a8a29e;
    }
    body.theme-mint {
      --app-bg: #042f2e;
      --card-bg: #134e4a;
      --border: #0f766e;
      --accent: #2dd4bf;
      --slide-bg: #134e4a;
      --slide-text: #f0fdfa;
      --muted: #99f6e4;
    }
    
    #home-screen {
      min-height: 100dvh;
      padding: 1.5rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .home-card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.75rem 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      max-height: 92vh;
      overflow-y: auto;
    }
    
    input[type="url"], input[type="text"], textarea {
      background: var(--app-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--app-text);
      font-size: 15px;
      line-height: 1.5;
      width: 100%;
      padding: 0.75rem 1rem;
      font-family: inherit;
      -webkit-appearance: none;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    
    #player-screen {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem;
      gap: 0.5rem;
      background: var(--app-bg);
    }
    
    .top-bar, .bottom-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    
    .stage-wrapper {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 9/16;
      max-height: calc(100dvh - 150px);
      margin: 0 auto;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: var(--slide-bg);
      border: 1px solid var(--border);
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      flex-shrink: 1;
      min-height: 0;
    }
    
    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem 1.25rem 1.25rem;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.25s ease-out;
      pointer-events: none;
      background: var(--slide-bg);
      overflow: hidden;
    }
    .slide.active {
      opacity: 1;
      transform: none;
      pointer-events: auto;
      z-index: 10;
    }
    
    .slide-content-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 0;
      gap: 0.6rem;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    
    .tweet-text {
      font-size: var(--text-size, 1.2rem);
      line-height: 1.5;
      font-weight: var(--text-weight, 500);
      letter-spacing: -0.01em;
      color: var(--slide-text);
      width: 100%;
      outline: none;
      border-radius: 8px;
      word-break: break-word;
      text-align: center;
      font-family: var(--slide-font, 'DM Sans', system-ui, sans-serif);
    }
    .tweet-text:focus {
      background: rgba(0,0,0,0.15);
      box-shadow: inset 0 0 0 1.5px var(--accent);
      padding: 0.4rem;
    }
    
    .slide-image {
      width: 100%;
      max-height: 38vh;
      object-fit: contain;
      border-radius: 10px;
      background: transparent;
      flex-shrink: 0;
    }
    
    .progress-wrap { flex-shrink: 0; width: 100%; margin-top: 0.4rem; }
    .progress-bar {
      height: 3px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #8b5cf6);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.3rem;
      font-size: 0.68rem;
      color: var(--muted);
      font-weight: 500;
    }
    
    .ctrl-btn {
      width: 44px; height: 44px;
      border-radius: 9999px;
      display: flex; align-items: center; justify-content: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--app-text);
      transition: all 0.15s;
    }
    .ctrl-btn:active { transform: scale(0.93); }
    .ctrl-btn:disabled { opacity: 0.3; pointer-events: none; }
    
    .primary-btn {
      background: linear-gradient(135deg, var(--accent), #6366f1);
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.7rem 1.3rem;
      border-radius: 9999px;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .primary-btn:active { transform: scale(0.97); }
    .primary-btn:disabled { opacity: 0.5; pointer-events: none; }
    
    .ghost-btn {
      background: var(--card-bg);
      color: var(--app-text);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.7rem 1.2rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
    }
    
    .danger-btn {
      background: #ef4444;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.7rem 1.3rem;
      border-radius: 9999px;
      border: none;
    }
    
    .rec-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    
    .toast {
      position: fixed;
      bottom: max(1.5rem, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(140%);
      background: var(--card-bg);
      color: var(--app-text);
      border: 1px solid var(--border);
      padding: 0.7rem 1.25rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.85rem;
      z-index: 200;
      transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    
    .hint { font-size: 0.7rem; color: var(--muted); text-align: center; flex-shrink: 0; }
    .label { font-size: 0.7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    
    /* Customization panel */
    .custom-panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 1.25rem 1.25rem max(1.5rem, env(safe-area-inset-bottom));
      z-index: 150;
      transform: translateY(110%);
      transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
      max-height: 70vh;
      overflow-y: auto;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.3);
    }
    .custom-panel.open { transform: translateY(0); }
    
    .custom-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 140;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .custom-backdrop.open { opacity: 1; pointer-events: auto; }
    
    .theme-swatch {
      width: 36px; height: 36px;
      border-radius: 10px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }
    .theme-swatch.active { border-color: var(--accent); transform: scale(1.1); }
    
    .size-btn, .font-btn {
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--app-bg);
      color: var(--app-text);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
    }
    .size-btn.active, .font-btn.active {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 20%, transparent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div id="toast" class="toast">Ready</div>
  <div id="custom-backdrop" class="custom-backdrop" onclick="closeCustom()"></div>

  <!-- CUSTOMIZATION PANEL -->
  <div id="custom-panel" class="custom-panel">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-semibold text-base">Customize slides</h3>
      <button onclick="closeCustom()" class="ctrl-btn !w-9 !h-9">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="space-y-4">
      <div>
        <p class="label mb-2">Theme</p>
        <div class="flex gap-2.5 flex-wrap">
          <button class="theme-swatch active" data-theme="" style="background:linear-gradient(135deg,#0f172a,#1e293b)" onclick="setTheme('')" title="Dark"></button>
          <button class="theme-swatch" data-theme="theme-light" style="background:linear-gradient(135deg,#f4f2ef,#fff)" onclick="setTheme('theme-light')" title="Light"></button>
          <button class="theme-swatch" data-theme="theme-midnight" style="background:linear-gradient(135deg,#0a0a0f,#12121a)" onclick="setTheme('theme-midnight')" title="Midnight"></button>
          <button class="theme-swatch" data-theme="theme-warm" style="background:linear-gradient(135deg,#1c1917,#292524)" onclick="setTheme('theme-warm')" title="Warm"></button>
          <button class="theme-swatch" data-theme="theme-mint" style="background:linear-gradient(135deg,#042f2e,#134e4a)" onclick="setTheme('theme-mint')" title="Mint"></button>
        </div>
      </div>

      <div>
        <p class="label mb-2">Text size</p>
        <div class="flex gap-2 flex-wrap">
          <button class="size-btn" data-size="1.05rem" onclick="setTextSize('1.05rem', this)">S</button>
          <button class="size-btn active" data-size="1.2rem" onclick="setTextSize('1.2rem', this)">M</button>
          <button class="size-btn" data-size="1.4rem" onclick="setTextSize('1.4rem', this)">L</button>
          <button class="size-btn" data-size="1.6rem" onclick="setTextSize('1.6rem', this)">XL</button>
        </div>
      </div>

      <div>
        <p class="label mb-2">Font</p>
        <div class="flex gap-2 flex-wrap">
          <button class="font-btn active" data-font="'DM Sans', system-ui, sans-serif" onclick="setFont(this)">Sans</button>
          <button class="font-btn" data-font="'Space Grotesk', system-ui, sans-serif" onclick="setFont(this)">Modern</button>
          <button class="font-btn" data-font="'Playfair Display', Georgia, serif" onclick="setFont(this)">Serif</button>
        </div>
      </div>

      <div>
        <p class="label mb-2">Text weight</p>
        <div class="flex gap-2 flex-wrap">
          <button class="size-btn" data-w="400" onclick="setWeight('400', this)">Regular</button>
          <button class="size-btn active" data-w="500" onclick="setWeight('500', this)">Medium</button>
          <button class="size-btn" data-w="600" onclick="setWeight('600', this)">Semi</button>
          <button class="size-btn" data-w="700" onclick="setWeight('700', this)">Bold</button>
        </div>
      </div>
    </div>
  </div>

  <!-- HOME -->
  <div id="home-screen">
    <div class="home-card space-y-4">
      <div class="text-center space-y-1">
        <h1 class="text-2xl font-bold tracking-tight">
          Thread → <span style="background:linear-gradient(90deg,var(--accent),#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Shorts</span>
        </h1>
        <p class="text-sm" style="color:var(--muted)">Paste thread → customize → record</p>
      </div>

      <div class="space-y-1.5">
        <label class="label">Thread URL (optional)</label>
        <div class="flex gap-2">
          <input type="url" id="url-input" placeholder="https://x.com/user/status/…" inputmode="url" />
          <button id="fetch-btn" onclick="fetchFromUrl()" class="primary-btn shrink-0 text-sm py-2 px-3">
            <span id="fetch-label">Fetch</span>
          </button>
        </div>
      </div>

      <div class="relative flex items-center gap-3 py-1">
        <div class="flex-1 h-px" style="background:var(--border)"></div>
        <span class="text-xs" style="color:var(--muted)">or paste text</span>
        <div class="flex-1 h-px" style="background:var(--border)"></div>
      </div>

      <div class="space-y-1.5">
        <label class="label">Thread text</label>
        <textarea id="thread-input" rows="5" placeholder="1/ First idea

2/ Second idea

3/ …"></textarea>
      </div>

      <div class="flex gap-2 pt-1">
        <button onclick="buildSlides()" class="primary-btn flex-1 justify-center text-sm py-2.5">Generate Slides</button>
        <button onclick="loadDemo()" class="ghost-btn text-sm py-2.5 px-4">Demo</button>
      </div>
    </div>
  </div>

  <!-- PLAYER -->
  <div id="player-screen" class="hidden">
    <div class="top-bar">
      <button onclick="goHome()" class="ctrl-btn" aria-label="Home">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
      </button>
      
      <div class="flex items-center gap-2 text-sm font-medium" style="color:var(--muted)">
        <span id="slide-counter">1 / 1</span>
        <span id="rec-indicator" class="hidden items-center gap-1.5 text-red-400 font-semibold text-xs">
          <span class="rec-dot"></span> REC
        </span>
      </div>
      
      <div class="flex gap-2">
        <button onclick="openCustom()" class="ctrl-btn" aria-label="Customize" title="Customize">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
        </button>
        <button onclick="toggleTTS()" id="tts-btn" class="ctrl-btn" aria-label="Read aloud">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
        </button>
      </div>
    </div>

    <div class="stage-wrapper" id="stage"></div>
    <p class="hint">Ctrl+V / Cmd+V to paste image · customize icon for themes</p>

    <div class="bottom-bar">
      <button onclick="prevSlide()" id="prev-btn" class="ctrl-btn" disabled>
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div class="flex gap-2">
        <button onclick="startRecording()" id="rec-btn" class="primary-btn">
          <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
          Record
        </button>
        <button onclick="stopRecording()" id="stop-btn" class="danger-btn hidden">Stop</button>
      </div>
      <button onclick="nextSlide()" id="next-btn" class="ctrl-btn">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>

  <script>
    let slides = [];
    let current = 0;
    let isSpeaking = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let stream = null;

    function toast(msg, duration = 2400) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._tid);
      t._tid = setTimeout(() => t.classList.remove('show'), duration);
    }

    function cleanText(t) {
      return (t || '')
        .replace(/https?:\/\/t\.co\/\S+/g, '')
        .replace(/https?:\/\/\S+/g, '')
        .replace(/@\w+/g, '')
        .replace(/^[A-Za-z0-9_\s.'-]{1,40}\s*[·•\-|–—]\s*.*$/gm, '')
        .replace(/^(RT|via|from)\s+/i, '')
        .replace(/^\s*[A-Z][\w.'-]+(?:\s+[A-Z][\w.'-]+)?\s*:\s*/gm, '')
        .replace(/^\s*[·•\-–—]+\s*$/gm, '')
        .replace(/\s+/g, ' ')
        .replace(/^\s*[·•\-–—]+\s*/g, '')
        .trim();
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ========== CUSTOMIZATION ==========
    function openCustom() {
      document.getElementById('custom-panel').classList.add('open');
      document.getElementById('custom-backdrop').classList.add('open');
    }
    function closeCustom() {
      document.getElementById('custom-panel').classList.remove('open');
      document.getElementById('custom-backdrop').classList.remove('open');
    }
    function setTheme(cls) {
      document.body.className = cls;
      document.querySelectorAll('.theme-swatch').forEach(b => b.classList.toggle('active', b.dataset.theme === cls));
      toast(cls ? cls.replace('theme-','') + ' theme' : 'Dark theme');
    }
    function setTextSize(size, btn) {
      document.documentElement.style.setProperty('--text-size', size);
      document.querySelectorAll('.size-btn[data-size]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    function setFont(btn) {
      document.documentElement.style.setProperty('--slide-font', btn.dataset.font);
      document.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    function setWeight(w, btn) {
      document.documentElement.style.setProperty('--text-weight', w);
      document.querySelectorAll('.size-btn[data-w]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // ========== FETCH ==========
    function parseUrl(url) {
      const m = url.match(/(?:x|twitter|fxtwitter|vxtwitter)\.com\/(?:#!\/)?(\w+)\/status(?:es)?\/(\d+)/i);
      if (m) return { handle: m[1], id: m[2] };
      const idOnly = url.match(/status\/(\d+)/i) || url.match(/^(\d{10,})$/);
      if (idOnly) return { handle: null, id: idOnly[1] };
      return null;
    }

    function extractImage(tw) {
      if (!tw) return null;
      const media = tw.media || {};
      if (Array.isArray(media.photos) && media.photos.length) {
        const p = media.photos[0];
        return (typeof p === 'string' ? p : (p.url || p.media_url_https || p.src)) || null;
      }
      if (Array.isArray(media.images) && media.images.length) {
        const p = media.images[0];
        return (typeof p === 'string' ? p : (p.url || p.media_url_https || p.src)) || null;
      }
      if (Array.isArray(media.all) && media.all.length) {
        const photo = media.all.find(x => !x.type || x.type === 'photo');
        if (photo) return photo.url || photo.media_url_https || photo.src || null;
        const first = media.all[0];
        if (first) return first.thumbnail_url || first.url || first.media_url_https || null;
      }
      if (Array.isArray(media.videos) && media.videos.length) {
        return media.videos[0].thumbnail_url || media.videos[0].thumbnail || null;
      }
      return tw.image || tw.thumbnail_url || null;
    }

    async function fetchFromUrl() {
      const rawUrl = document.getElementById('url-input').value.trim();
      if (!rawUrl) { toast('Paste a URL first'); return; }
      const parsed = parseUrl(rawUrl);
      if (!parsed) { toast('Invalid URL'); return; }

      const btn = document.getElementById('fetch-btn');
      const label = document.getElementById('fetch-label');
      btn.disabled = true;
      label.textContent = '…';

      try {
        let items = [];
        try {
          const fxUrl = parsed.handle
            ? `https://api.fxtwitter.com/${parsed.handle}/status/${parsed.id}`
            : `https://api.fxtwitter.com/status/${parsed.id}`;
          const res = await fetch(fxUrl);
          if (res.ok) {
            const data = await res.json();
            const tw = data.tweet || data.status;
            if (tw) {
              const text = cleanText(tw.text || '');
              const image = extractImage(tw);
              if (text || image) items.push({ text: text || '', image });
            }
          }
        } catch (e) {}

        if (items.length <= 1) {
          try {
            const api = new URL('https://x.pcstyle.dev/api/v1/posts');
            api.searchParams.set('url', rawUrl);
            api.searchParams.set('thread', 'full');
            api.searchParams.set('format', 'json');
            api.searchParams.set('context', 'thread');
            api.searchParams.set('replies', 'off');
            const res2 = await fetch(api.toString());
            if (res2.ok) {
              const data2 = await res2.json();
              if (data2.markdown || typeof data2 === 'string') {
                const md = data2.markdown || data2;
                const blocks = md.split(/##\s+(?:Post|Thread|Reply)\s+[·•]\s*\d+/i);
                const newItems = [];
                for (const block of blocks) {
                  const imgMatch = block.match(/!\[.*?\]\((https?:\/\/[^\s)]+)\)/);
                  let text = cleanText(block
                    .replace(/!\[.*?\]\([^\)]+\)/g, '')
                    .replace(/Source:.*$/gim, '')
                    .replace(/---/g, '')
                    .replace(/>\s*/g, '')
                    .replace(/^#+\s*.*$/gm, '')
                    .replace(/^[A-Za-z0-9_\s]{1,40}\s*[·•]\s*.*$/gm, '')
                    .replace(/@\w+/g, ''));
                  if (text.length > 6 || imgMatch) {
                    newItems.push({ text, image: imgMatch ? imgMatch[1] : null });
                  }
                }
                if (newItems.length > items.length) items = newItems;
              }
            }
          } catch (e) {}
        }

        if (items.length === 0) {
          toast('Could not fetch. Paste the text instead.');
          return;
        }

        document.getElementById('thread-input').value = items.map((it, i) => `${i + 1}/ ${it.text}`).join('\n\n');
        slides = items.map(it => ({ text: it.text, image: it.image || null }));
        renderSlides();
        confetti({ particleCount: 35, spread: 45, origin: { y: 0.7 }, colors: ['#3b82f6','#8b5cf6'] });
        toast(`${slides.length} slides ready`);
      } catch (err) {
        toast('Fetch failed. Paste the text.');
      } finally {
        btn.disabled = false;
        label.textContent = 'Fetch';
      }
    }

    function parseThread(raw) {
      const text = raw.trim();
      if (!text) return [];
      const numbered = text.split(/(?:^|\n)\s*(?:\d+[\.\/\)]\s*)/g).map(s => s.trim()).filter(Boolean);
      if (numbered.length > 1) return numbered.map(t => ({ text: cleanText(t), image: null }));
      return text.split(/\n\s*\n+/).map(s => s.trim()).filter(Boolean).map(t => ({ text: cleanText(t), image: null }));
    }

    function buildSlides() {
      const items = parseThread(document.getElementById('thread-input').value);
      if (items.length === 0) { toast('Paste thread text first'); return; }
      slides = items;
      renderSlides();
      confetti({ particleCount: 40, spread: 50, origin: { y: 0.75 }, colors: ['#3b82f6','#8b5cf6'] });
    }

    function renderSlides() {
      const stage = document.getElementById('stage');
      stage.innerHTML = '';

      slides.forEach((item, i) => {
        const slide = document.createElement('div');
        slide.className = 'slide' + (i === 0 ? ' active' : '');
        const hasImage = !!item.image;
        const hasText = !!(item.text && item.text.trim());

        let inner = '<div class="slide-content-box">';
        if (hasText) {
          inner += `<div class="tweet-text" contenteditable="true" spellcheck="false" data-idx="${i}">${escapeHtml(item.text)}</div>`;
        } else {
          inner += `<div class="tweet-text" contenteditable="true" data-idx="${i}">(tap to add text)</div>`;
        }

        let imgSrc = item.image || '';
        if (imgSrc && !imgSrc.startsWith('data:') && (imgSrc.includes('pbs.twimg.com') || imgSrc.includes('twimg.com'))) {
          imgSrc = 'https://images.weserv.nl/?url=' + encodeURIComponent(imgSrc.replace(/^https?:\/\//, '')) + '&w=800&output=webp';
        }
        inner += `<div id="img-container-${i}" class="w-full flex flex-col items-center" style="${hasImage ? '' : 'display:none;'}">
          <img id="slide-img-${i}" class="slide-image" src="${escapeHtml(imgSrc)}" alt="" loading="lazy"
            onerror="if(this.dataset.tried!=='1'&&this.src.indexOf('weserv')!==-1){this.dataset.tried='1';this.src='${escapeHtml(item.image||'')}';}else{this.style.display='none';}">
        </div>`;
        inner += '</div>';

        slide.innerHTML = `
          ${inner}
          <div class="progress-wrap">
            <div class="progress-bar"><div class="progress-fill" style="width:${((i+1)/slides.length)*100}%"></div></div>
            <div class="slide-footer">
              <span>${i + 1} / ${slides.length}</span>
              <span>Ctrl+V to paste image</span>
            </div>
          </div>`;
        stage.appendChild(slide);
      });

      stage.querySelectorAll('.tweet-text[contenteditable]').forEach(el => {
        el.addEventListener('input', () => {
          const idx = +el.dataset.idx;
          if (slides[idx]) slides[idx].text = el.innerText.trim();
        });
      });

      current = 0;
      updateUI();
      document.getElementById('home-screen').classList.add('hidden');
      document.getElementById('player-screen').classList.remove('hidden');
      toast(`${slides.length} slides ready`);
    }

    // Paste image
    window.addEventListener('paste', e => {
      if (document.getElementById('player-screen').classList.contains('hidden')) return;
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.indexOf('image') === 0) {
          const blob = item.getAsFile();
          const reader = new FileReader();
          reader.onload = function(event) {
            slides[current].image = event.target.result;
            updateSlideImage(current, event.target.result);
            toast('Image pasted on slide ' + (current + 1));
          };
          reader.readAsDataURL(blob);
          e.preventDefault();
          break;
        }
      }
    });

    function updateSlideImage(idx, url) {
      slides[idx].image = url ? url.trim() : null;
      const imgElem = document.getElementById(`slide-img-${idx}`);
      const container = document.getElementById(`img-container-${idx}`);
      if (!imgElem || !container) return;
      if (url && url.trim()) {
        let finalSrc = url.trim();
        if (!finalSrc.startsWith('data:') && (finalSrc.includes('pbs.twimg.com') || finalSrc.includes('twimg.com'))) {
          finalSrc = 'https://images.weserv.nl/?url=' + encodeURIComponent(finalSrc.replace(/^https?:\/\//, '')) + '&w=800&output=webp';
        }
        imgElem.onerror = function() {
          if (this.dataset.tried !== '1' && !url.startsWith('data:')) {
            this.dataset.tried = '1';
            this.src = url.trim();
          } else this.style.display = 'none';
        };
        imgElem.src = finalSrc;
        imgElem.style.display = 'block';
        container.style.display = 'flex';
      } else {
        imgElem.src = '';
        container.style.display = 'none';
      }
    }

    function loadDemo() {
      document.getElementById('thread-input').value = `1/ Most people treat Twitter threads like bulky blog posts.

2/ The highest-retention format uses vertical short-form: one idea per slide.

3/ Copy any image from X and press Ctrl+V on a slide to attach it.

4/ Customize theme, font & size — then record and export.`;
      buildSlides();
    }

    function goTo(index) {
      if (index < 0 || index >= slides.length) return;
      document.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('active', i === index));
      current = index;
      updateUI();
      if (isSpeaking) stopTTS();
    }
    function nextSlide() { goTo(current + 1); }
    function prevSlide() { goTo(current - 1); }
    function updateUI() {
      document.getElementById('slide-counter').textContent = `${current + 1} / ${slides.length}`;
      document.getElementById('prev-btn').disabled = current === 0;
      document.getElementById('next-btn').disabled = current === slides.length - 1;
    }
    function goHome() {
      stopTTS();
      if (mediaRecorder?.state === 'recording') stopRecording();
      closeCustom();
      document.getElementById('player-screen').classList.add('hidden');
      document.getElementById('home-screen').classList.remove('hidden');
    }

    document.addEventListener('keydown', e => {
      if (document.getElementById('player-screen').classList.contains('hidden')) return;
      if (document.activeElement?.isContentEditable || document.activeElement?.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key === 'Escape') { closeCustom(); goHome(); }
    });

    let touchStartX = 0;
    document.getElementById('stage').addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    document.getElementById('stage').addEventListener('touchend', e => {
      if (document.activeElement?.isContentEditable) return;
      const dx = e.changedTouches[0].screenX - touchStartX;
      if (dx < -60) nextSlide();
      if (dx > 60) prevSlide();
    }, { passive: true });

    // TTS
    function getBestVoice() {
      const voices = speechSynthesis.getVoices();
      return voices.find(v => v.lang === 'en-IN' || /india|ravi|neerja/i.test(v.name))
        || voices.find(v => v.lang.startsWith('en')) || voices[0];
    }
    function toggleTTS() {
      if (isSpeaking) { stopTTS(); return; }
      speakCurrent();
    }
    function speakCurrent() {
      if (!('speechSynthesis' in window)) { toast('TTS not supported'); return; }
      stopTTS();
      const text = slides[current]?.text;
      if (!text) { toast('No text on this slide'); return; }
      const utt = new SpeechSynthesisUtterance(text);
      const voice = getBestVoice();
      if (voice) utt.voice = voice;
      utt.rate = 0.93;
      utt.onstart = () => { isSpeaking = true; document.getElementById('tts-btn').style.boxShadow = '0 0 0 2px var(--accent)'; };
      utt.onend = utt.onerror = () => { isSpeaking = false; document.getElementById('tts-btn').style.boxShadow = ''; };
      speechSynthesis.speak(utt);
    }
    function stopTTS() {
      speechSynthesis.cancel();
      isSpeaking = false;
      const btn = document.getElementById('tts-btn');
      if (btn) btn.style.boxShadow = '';
    }
    if ('speechSynthesis' in window) {
      speechSynthesis.onvoiceschanged = () => {};
      speechSynthesis.getVoices();
    }

    // Recording
    async function startRecording() {
      if (!navigator.mediaDevices || !window.MediaRecorder) {
        toast('Recording not supported');
        return;
      }
      try {
        let displayStream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: 30 }, audio: false, preferCurrentTab: true
        }).catch(() => null);
        if (!displayStream) {
          toast('Screen share required. Use desktop Chrome/Edge.');
          return;
        }
        let audioStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true }
        }).catch(() => null);
        const tracks = [...displayStream.getVideoTracks()];
        if (audioStream) tracks.push(...audioStream.getAudioTracks());
        stream = new MediaStream(tracks);
        recordedChunks = [];
        const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
          ? 'video/webm;codecs=vp9,opus' : 'video/webm';
        mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
        mediaRecorder.ondataavailable = e => { if (e.data.size) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `thread-short-${Date.now()}.webm`;
          a.click();
          URL.revokeObjectURL(url);
          toast('Video downloaded!');
          confetti({ particleCount: 50, spread: 55, origin: { y: 0.65 }, colors: ['#3b82f6','#8b5cf6'] });
          stream.getTracks().forEach(t => t.stop());
          stream = null;
        };
        mediaRecorder.start(250);
        document.getElementById('rec-btn').classList.add('hidden');
        document.getElementById('stop-btn').classList.remove('hidden');
        document.getElementById('rec-indicator').classList.remove('hidden');
        document.getElementById('rec-indicator').classList.add('flex');
        toast('Recording…');
      } catch (err) {
        toast('Recording failed. Use desktop Chrome/Edge.');
      }
    }
    function stopRecording() {
      if (mediaRecorder?.state === 'recording') mediaRecorder.stop();
      document.getElementById('rec-btn').classList.remove('hidden');
      document.getElementById('stop-btn').classList.add('hidden');
      document.getElementById('rec-indicator').classList.add('hidden');
      document.getElementById('rec-indicator').classList.remove('flex');
    }

    document.getElementById('url-input')?.addEventListener('keydown', e => {
      if (e.key === 'Enter') fetchFromUrl();
    });
  </script>
</body>
</html>
