<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Thread → Shorts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      width: 100%;
      overflow-x: hidden;
    }
    
    /* Theme variables */
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-grad: linear-gradient(135deg, #3b82f6, #6366f1);
    }

    body.theme-paper {
      --bg-main: #f4f2ef;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent-grad: linear-gradient(135deg, #0284c7, #2563eb);
    }

    body.theme-emerald {
      --bg-main: #064e3b;
      --card-bg: #065f46;
      --border-color: #047857;
      --text-main: #ecfdf5;
      --text-muted: #a7f3d0;
      --accent-grad: linear-gradient(135deg, #10b981, #059669);
    }

    body.theme-neon {
      --bg-main: #09090b;
      --card-bg: #18181b;
      --border-color: #27272a;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
      --accent-grad: linear-gradient(135deg, #ec4899, #8b5cf6);
    }
    
    body {
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.3s ease, color 0.3s ease;
    }
    
    #home-screen {
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      padding: 1.5rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .home-card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.75rem 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-height: 90vh;
      overflow-y: auto;
    }
    
    input[type="url"], input[type="text"], textarea, select {
      background: var(--bg-main);
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 15px;
      line-height: 1.5;
      width: 100%;
      padding: 0.75rem 1rem;
      font-family: inherit;
      -webkit-appearance: none;
      transition: border-color 0.2s;
    }
    input[type="url"]:focus, input[type="text"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #3b82f6;
      background: var(--bg-main);
    }
    
    #player-screen {
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem;
      gap: 0.5rem;
      background: var(--bg-main);
    }
    
    .top-bar, .bottom-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      padding: 0 0.15rem;
    }
    
    .stage-wrapper {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 9 / 16;
      max-height: calc(100dvh - 150px);
      margin: 0 auto;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
      flex-shrink: 1;
      min-height: 0;
    }
    
    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.25rem 1.15rem 1.15rem;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.25s ease-out;
      pointer-events: none;
      background: var(--card-bg);
      overflow: hidden;
    }
    
    .slide.active {
      opacity: 1;
      transform: none;
      pointer-events: auto;
      z-index: 10;
    }
    
    .slide-content-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 0;
      gap: 0.5rem;
      overflow-y: auto;
      padding: 0.1rem 0;
      -webkit-overflow-scrolling: touch;
    }
    
    .tweet-text {
      font-size: clamp(1rem, 3.8vw, 1.25rem);
      line-height: 1.45;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--text-main);
      width: 100%;
      outline: none;
      border-radius: 8px;
      word-break: break-word;
      text-align: center;
    }
    .tweet-text:focus {
      background: var(--bg-main);
      box-shadow: inset 0 0 0 1.5px #3b82f6;
      padding: 0.4rem;
    }
    
    .slide-image {
      width: 100%;
      max-height: 32vh;
      object-fit: contain;
      border-radius: 8px;
      background: var(--bg-main);
      flex-shrink: 0;
    }
    
    .slide-img-controls {
      display: flex;
      gap: 0.4rem;
      width: 100%;
      flex-shrink: 0;
    }
    
    .progress-wrap {
      flex-shrink: 0;
      width: 100%;
      margin-top: 0.3rem;
    }
    
    .progress-bar {
      height: 3px;
      background: var(--border-color);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent-grad);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    
    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.2rem;
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    
    .ctrl-btn {
      width: 40px;
      height: 40px;
      min-width: 40px;
      min-height: 40px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      transition: all 0.15s;
    }
    .ctrl-btn:active { transform: scale(0.93); background: var(--border-color); }
    .ctrl-btn:disabled { opacity: 0.3; pointer-events: none; }
    
    .primary-btn {
      background: var(--accent-grad);
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.7rem 1.3rem;
      border-radius: 9999px;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 2px 8px rgba(59,130,246,0.3);
    }
    .primary-btn:active { transform: scale(0.97); }
    
    .sub-action-btn {
      background: var(--bg-main);
      color: var(--text-main);
      font-size: 0.7rem;
      font-weight: 500;
      padding: 0.35rem 0.6rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      white-space: nowrap;
    }
    .sub-action-btn:hover { opacity: 0.8; }

    .danger-btn {
      background: #ef4444;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.7rem 1.3rem;
      border-radius: 9999px;
      border: none;
    }
    
    .ghost-btn {
      background: var(--card-bg);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.7rem 1.2rem;
      border-radius: 9999px;
      border: 1px solid var(--border-color);
    }
    
    .rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    .toast {
      position: fixed;
      bottom: max(1.5rem, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(140%);
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.7rem 1.25rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.85rem;
      z-index: 200;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    
    .hint {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: center;
      flex-shrink: 0;
    }
    
    .label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body class="theme-slate">
  <div id="toast" class="toast">Ready</div>

  <!-- HOME -->
  <div id="home-screen">
    <div class="home-card space-y-4">
      <div class="text-center space-y-1">
        <h1 class="text-2xl font-bold tracking-tight">
          Thread → <span style="background:var(--accent-grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Shorts</span>
        </h1>
        <p style="color:var(--text-muted);" class="text-xs">Paste thread → clean slides → record</p>
      </div>

      <!-- Theme Selector -->
      <div class="space-y-1">
        <label class="label">Visual Theme</label>
        <select id="theme-selector" onchange="changeTheme(this.value)">
          <option value="theme-slate">Midnight Slate (Dark)</option>
          <option value="theme-paper">Warm Paper &amp; Charcoal</option>
          <option value="theme-emerald">Deep Emerald</option>
          <option value="theme-neon">Cyber Neon</option>
        </select>
      </div>

      <div class="space-y-1.5">
        <label class="label">Paste Thread Text</label>
        <textarea id="thread-input" rows="6" placeholder="1/ Paste your tweet thread here...&#10;&#10;2/ Usernames and handles are automatically removed!&#10;&#10;3/ Add images via URL/Upload or press Ctrl+V on any slide."></textarea>
      </div>

      <div class="flex gap-2 pt-1">
        <button onclick="buildSlides()" class="primary-btn flex-1 justify-center text-sm py-2.5">
          Generate Slides
        </button>
        <button onclick="loadDemo()" class="ghost-btn text-sm py-2.5 px-4">
          Demo
        </button>
      </div>
    </div>
  </div>

  <!-- PLAYER -->
  <div id="player-screen" class="hidden">
    <div class="top-bar">
      <button onclick="goHome()" class="ctrl-btn" aria-label="Home">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
      </button>
      
      <div style="color:var(--text-muted);" class="flex items-center gap-2 text-sm font-medium">
        <span id="slide-counter">1 / 1</span>
        <span id="rec-indicator" class="hidden items-center gap-1.5 text-red-400 font-semibold text-xs">
          <span class="rec-dot"></span> REC
        </span>
      </div>
      
      <div class="flex items-center gap-1.5">
        <button onclick="addSlide()" class="sub-action-btn px-2.5 py-2 font-semibold" title="Add new slide">+ Slide</button>
        <button onclick="toggleTTS()" id="tts-btn" class="ctrl-btn" aria-label="Read aloud">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
        </button>
      </div>
    </div>

    <!-- Stage -->
    <div class="stage-wrapper" id="stage"></div>
    
    <p class="hint">💡 Tip: Tap text to edit · Paste URL, Upload, or Ctrl+V image on each slide</p>

    <div class="bottom-bar">
      <button onclick="prevSlide()" id="prev-btn" class="ctrl-btn" disabled aria-label="Previous">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
      </button>

      <div class="flex gap-2">
        <button onclick="startRecording()" id="rec-btn" class="primary-btn">
          <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
          Record
        </button>
        <button onclick="stopRecording()" id="stop-btn" class="danger-btn hidden">Stop</button>
      </div>

      <button onclick="nextSlide()" id="next-btn" class="ctrl-btn" aria-label="Next">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>

  <script>
    let slides = [];
    let current = 0;
    let isSpeaking = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let stream = null;

    function toast(msg, duration = 2600) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._tid);
      t._tid = setTimeout(() => t.classList.remove('show'), duration);
    }

    function changeTheme(themeClass) {
      document.body.className = themeClass;
    }

    function cleanText(t) {
      return (t || '')
        .replace(/https?:\/\/t\.co\/\S+/g, '')
        .replace(/https?:\/\/\S+/g, '')
        .replace(/@\w+/g, '') // remove handles
        .replace(/^[A-Za-z0-9_\s.'-]{1,40}\s*[·•\-|–—]\s*@?\w+.*$/gm, '') // remove "Name · @handle"
        .replace(/^(RT|via|from)\s+/i, '')
        .replace(/^\s*[A-Z][\w.'-]+(?:\s+[A-Z][\w.'-]+)?\s*:\s*/gm, '') // remove name prefixes
        .replace(/^\s*[·•\-–—]+\s*$/gm, '')
        .replace(/\s+/g, ' ')
        .replace(/^\s*[·•\-–—]+\s*/g, '')
        .trim();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }

    function parseThread(raw) {
      const text = raw.trim();
      if (!text) return [];
      const numbered = text.split(/(?:^|\n)\s*(?:\d+[\.\/\)]\s*)/g).map(s => s.trim()).filter(Boolean);
      if (numbered.length > 1) return numbered.map(t => ({ text: cleanText(t), image: null }));
      return text.split(/\n\s*\n+/).map(s => s.trim()).filter(Boolean).map(t => ({ text: cleanText(t), image: null }));
    }

    function buildSlides() {
      const items = parseThread(document.getElementById('thread-input').value);
      if (items.length === 0) { toast('Paste thread text first'); return; }
      slides = items;
      renderSlides();
      confetti({ particleCount: 40, spread: 50, origin: { y: 0.75 }, colors: ['#3b82f6','#8b5cf6','#f59e0b'] });
    }

    function renderSlides() {
      const stage = document.getElementById('stage');
      stage.innerHTML = '';

      slides.forEach((item, i) => {
        const slide = document.createElement('div');
        slide.className = 'slide' + (i === current ? ' active' : '');
        const hasImage = !!item.image;
        const hasText = !!(item.text && item.text.trim());

        let imgSrc = item.image || '';
        if (imgSrc && !imgSrc.startsWith('data:') && (imgSrc.includes('pbs.twimg.com') || imgSrc.includes('twimg.com'))) {
          imgSrc = 'https://images.weserv.nl/?url=' + encodeURIComponent(imgSrc.replace(/^https?:\/\//, '')) + '&w=800&output=webp';
        }

        let inner = '<div class="slide-content-box">';
        if (hasText) {
          inner += `<div class="tweet-text" contenteditable="true" spellcheck="false" data-idx="${i}">${escapeHtml(item.text)}</div>`;
        } else {
          inner += `<div class="tweet-text" contenteditable="true" data-idx="${i}">(tap to add text)</div>`;
        }

        // Image Display Box
        inner += `<div id="img-container-${i}" class="w-full flex flex-col items-center" style="${hasImage ? '' : 'display:none;'}">
          <img id="slide-img-${i}" class="slide-image" src="${escapeHtml(imgSrc)}" alt="" loading="lazy" onerror="this.style.display='none'">
        </div>`;

        // Manual Controls per slide (URL input + Upload + Delete button)
        inner += `<div class="slide-img-controls">
          <input type="text" id="img-url-input-${i}" placeholder="Paste image URL here..." value="${escapeHtml(item.image || '')}" oninput="updateSlideImage(${i}, this.value)" class="text-xs py-1.5 px-2" />
          <label class="sub-action-btn flex items-center justify-center shrink-0 cursor-pointer">
            Upload
            <input type="file" accept="image/*" class="hidden" onchange="handleFileUpload(${i}, event)" />
          </label>
          ${slides.length > 1 ? `<button onclick="deleteSlide(${i})" class="sub-action-btn bg-red-900/40 border-red-700 text-red-300 px-2 py-1.5" title="Delete Slide">✕</button>` : ''}
        </div>`;

        inner += '</div>';

        slide.innerHTML = `
          ${inner}
          <div class="progress-wrap">
            <div class="progress-bar"><div class="progress-fill" style="width:${((i+1)/slides.length)*100}%"></div></div>
            <div class="slide-footer">
              <span>${i + 1} / ${slides.length}</span>
              <span>tap text to edit</span>
            </div>
          </div>`;
        stage.appendChild(slide);
      });

      stage.querySelectorAll('.tweet-text[contenteditable]').forEach(el => {
        el.addEventListener('input', () => {
          const idx = +el.dataset.idx;
          if (slides[idx]) slides[idx].text = el.innerText.trim();
        });
      });

      updateUI();
      document.getElementById('home-screen').classList.add('hidden');
      document.getElementById('player-screen').classList.remove('hidden');
    }

    function addSlide() {
      slides.splice(current + 1, 0, { text: 'New slide content...', image: null });
      current++;
      renderSlides();
      toast('Added new slide');
    }

    function deleteSlide(idx) {
      if (slides.length <= 1) return;
      slides.splice(idx, 1);
      if (current >= slides.length) current = slides.length - 1;
      renderSlides();
      toast('Slide removed');
    }

    function updateSlideImage(idx, url) {
      slides[idx].image = url ? url.trim() : null;
      const imgElem = document.getElementById(`slide-img-${idx}`);
      const container = document.getElementById(`img-container-${idx}`);
      if (!imgElem || !container) return;

      if (url && url.trim()) {
        let finalSrc = url.trim();
        if (!finalSrc.startsWith('data:') && (finalSrc.includes('pbs.twimg.com') || finalSrc.includes('twimg.com'))) {
          finalSrc = 'https://images.weserv.nl/?url=' + encodeURIComponent(finalSrc.replace(/^https?:\/\//, '')) + '&w=800&output=webp';
        }
        imgElem.src = finalSrc;
        imgElem.style.display = 'block';
        container.style.display = 'flex';
      } else {
        imgElem.src = '';
        container.style.display = 'none';
      }
    }

    function handleFileUpload(idx, event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Str = e.target.result;
        document.getElementById(`img-url-input-${idx}`).value = base64Str;
        updateSlideImage(idx, base64Str);
        toast('Image uploaded!');
      };
      reader.readAsDataURL(file);
    }

    // Global Paste Support (Ctrl+V)
    window.addEventListener('paste', e => {
      if (document.getElementById('player-screen').classList.contains('hidden')) return;
      const items = e.clipboardData?.items;
      if (!items) return;

      for (const item of items) {
        if (item.type.indexOf('image') === 0) {
          const blob = item.getAsFile();
          const reader = new FileReader();
          reader.onload = function(event) {
            const base64 = event.target.result;
            slides[current].image = base64;
            const urlInput = document.getElementById(`img-url-input-${current}`);
            if (urlInput) urlInput.value = base64;
            updateSlideImage(current, base64);
            toast('Image pasted on slide ' + (current + 1));
          };
          reader.readAsDataURL(blob);
          e.preventDefault();
          break;
        }
      }
    });

    function loadDemo() {
      document.getElementById('thread-input').value = `1/ Most people treat Twitter threads like bulky blog posts.

2/ The highest-retention format uses vertical short-form: one idea per slide.

3/ Use the image controls or press Ctrl+V to paste visuals onto any slide.

4/ Record and export ready-to-post Shorts instantly!`;
      buildSlides();
    }

    function goTo(index) {
      if (index < 0 || index >= slides.length) return;
      document.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('active', i === index));
      current = index;
      updateUI();
      if (isSpeaking) stopTTS();
    }
    function nextSlide() { goTo(current + 1); }
    function prevSlide() { goTo(current - 1); }
    function updateUI() {
      document.getElementById('slide-counter').textContent = `${current + 1} / ${slides.length}`;
      document.getElementById('prev-btn').disabled = current === 0;
      document.getElementById('next-btn').disabled = current === slides.length - 1;
    }
    function goHome() {
      stopTTS();
      if (mediaRecorder?.state === 'recording') stopRecording();
      document.getElementById('player-screen').classList.add('hidden');
      document.getElementById('home-screen').classList.remove('hidden');
    }

    document.addEventListener('keydown', e => {
      if (document.getElementById('player-screen').classList.contains('hidden')) return;
      if (document.activeElement?.isContentEditable || document.activeElement?.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key === 'Escape') goHome();
    });

    let touchStartX = 0;
    document.getElementById('stage').addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });
    document.getElementById('stage').addEventListener('touchend', e => {
      if (document.activeElement?.isContentEditable) return;
      const dx = e.changedTouches[0].screenX - touchStartX;
      if (dx < -60) nextSlide();
      if (dx > 60) prevSlide();
    }, { passive: true });

    // TTS
    function getBestVoice() {
      const voices = speechSynthesis.getVoices();
      return voices.find(v => v.lang === 'en-IN' || /india|ravi|neerja/i.test(v.name))
        || voices.find(v => v.lang.startsWith('en'))
        || voices[0];
    }
    function toggleTTS() {
      if (isSpeaking) { stopTTS(); return; }
      speakCurrent();
    }
    function speakCurrent() {
      if (!('speechSynthesis' in window)) { toast('TTS not supported'); return; }
      stopTTS();
      const text = slides[current]?.text;
      if (!text) { toast('No text on this slide'); return; }
      const utt = new SpeechSynthesisUtterance(text);
      const voice = getBestVoice();
      if (voice) utt.voice = voice;
      utt.rate = 0.93;
      utt.onstart = () => {
        isSpeaking = true;
        document.getElementById('tts-btn').style.boxShadow = '0 0 0 2px #3b82f6';
      };
      utt.onend = utt.onerror = () => {
        isSpeaking = false;
        document.getElementById('tts-btn').style.boxShadow = '';
      };
      speechSynthesis.speak(utt);
    }
    function stopTTS() {
      speechSynthesis.cancel();
      isSpeaking = false;
      const btn = document.getElementById('tts-btn');
      if (btn) btn.style.boxShadow = '';
    }
    if ('speechSynthesis' in window) {
      speechSynthesis.onvoiceschanged = () => {};
      speechSynthesis.getVoices();
    }

    // RECORDING
    async function startRecording() {
      if (!navigator.mediaDevices || !window.MediaRecorder) {
        toast('Recording not supported on this browser');
        return;
      }
      try {
        let displayStream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: 30 },
          audio: false,
          preferCurrentTab: true
        }).catch(() => null);

        if (!displayStream) {
          toast('Screen share permission required. Use desktop Chrome/Edge.');
          return;
        }

        let audioStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true }
        }).catch(() => null);

        const tracks = [...displayStream.getVideoTracks()];
        if (audioStream) tracks.push(...audioStream.getAudioTracks());
        stream = new MediaStream(tracks);
        recordedChunks = [];

        const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
          ? 'video/webm;codecs=vp9,opus'
          : 'video/webm';

        mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
        mediaRecorder.ondataavailable = e => { if (e.data.size) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `thread-short-${Date.now()}.webm`;
          a.click();
          URL.revokeObjectURL(url);
          toast('Video downloaded!');
          confetti({ particleCount: 50, spread: 55, origin: { y: 0.65 }, colors: ['#3b82f6','#8b5cf6'] });
          stream.getTracks().forEach(t => t.stop());
          stream = null;
        };
        mediaRecorder.start(250);
        document.getElementById('rec-btn').classList.add('hidden');
        document.getElementById('stop-btn').classList.remove('hidden');
        document.getElementById('rec-indicator').classList.remove('hidden');
        document.getElementById('rec-indicator').classList.add('flex');
        toast('Recording… advance slides while speaking');
      } catch (err) {
        console.error(err);
        toast('Recording failed. Use desktop Chrome/Edge.');
      }
    }

    function stopRecording() {
      if (mediaRecorder?.state === 'recording') mediaRecorder.stop();
      document.getElementById('rec-btn').classList.remove('hidden');
      document.getElementById('stop-btn').classList.add('hidden');
      document.getElementById('rec-indicator').classList.add('hidden');
      document.getElementById('rec-indicator').classList.remove('flex');
    }
  </script>
</body>
</html>
