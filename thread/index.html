<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Thread → Shorts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      width: 100%;
      overflow-x: hidden;
    }
    
    /* Theme variables */
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-grad: linear-gradient(135deg, #3b82f6, #6366f1);
    }

    body.theme-paper {
      --bg-main: #f4f2ef;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent-grad: linear-gradient(135deg, #0284c7, #2563eb);
    }

    body.theme-emerald {
      --bg-main: #064e3b;
      --card-bg: #065f46;
      --border-color: #047857;
      --text-main: #ecfdf5;
      --text-muted: #a7f3d0;
      --accent-grad: linear-gradient(135deg, #10b981, #059669);
    }

    body.theme-neon {
      --bg-main: #09090b;
      --card-bg: #18181b;
      --border-color: #27272a;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
      --accent-grad: linear-gradient(135deg, #ec4899, #8b5cf6);
    }
    
    body {
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.3s ease, color 0.3s ease;
    }
    
    #home-screen {
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      padding: 1.5rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .home-card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.75rem 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-height: 90vh;
      overflow-y: auto;
    }
    
    input[type="url"], input[type="text"], textarea, select {
      background: var(--bg-main);
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 15px;
      line-height: 1.5;
      width: 100%;
      padding: 0.75rem 1rem;
      font-family: inherit;
      -webkit-appearance: none;
      transition: border-color 0.2s;
    }
    input[type="url"]:focus, input[type="text"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #3b82f6;
      background: var(--bg-main);
    }
    
    #player-screen {
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem;
      gap: 0.5rem;
      background: var(--bg-main);
    }
    
    .top-bar, .bottom-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      padding: 0 0.15rem;
    }
    
    .stage-wrapper {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 9 / 16;
      max-height: calc(100dvh - 140px);
      margin: 0 auto;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
      flex-shrink: 1;
      min-height: 0;
    }
    
    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem 1.25rem 1.25rem;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.25s ease-out;
      pointer-events: none;
      background: var(--card-bg);
      overflow: hidden;
    }
    
    .slide.active {
      opacity: 1;
      transform: none;
      pointer-events: auto;
      z-index: 10;
    }
    
    .slide-content-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 0;
      gap: 0.6rem;
      overflow-y: auto;
      padding: 0.2rem 0;
      -webkit-overflow-scrolling: touch;
    }
    
    .tweet-text {
      font-size: clamp(1.05rem, 4vw, 1.35rem);
      line-height: 1.5;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--text-main);
      width: 100%;
      outline: none;
      border-radius: 8px;
      word-break: break-word;
      text-align: center;
    }
    .tweet-text:focus {
      background: var(--bg-main);
      box-shadow: inset 0 0 0 1.5px #3b82f6;
      padding: 0.4rem;
    }
    
    .slide-image {
      width: 100%;
      max-height: 38vh;
      object-fit: contain;
      border-radius: 10px;
      background: var(--bg-main);
      flex-shrink: 0;
    }
    
    .progress-wrap {
      flex-shrink: 0;
      width: 100%;
      margin-top: 0.4rem;
    }
    
    .progress-bar {
      height: 3px;
      background: var(--border-color);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent-grad);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    
    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.3rem;
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    
    .ctrl-btn {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      transition: all 0.15s;
    }
    .ctrl-btn:active { transform: scale(0.93); background: var(--border-color); }
    .ctrl-btn:disabled { opacity: 0.3; pointer-events: none; }
    
    .primary-btn {
      background: var(--accent-grad);
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.7rem 1.3rem;
      border-radius: 9999px;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 2px 8px rgba(59,130,246,0.3);
    }
    .primary-btn:active { transform: scale(0.97); }
    .primary-btn:disabled { opacity: 0.5; pointer-events: none; }
    
    .danger-btn {
      background: #ef4444;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.7rem 1.3rem;
      border-radius: 9999px;
      border: none;
    }
    
    .ghost-btn {
      background: var(--card-bg);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.7rem 1.2rem;
      border-radius: 9999px;
      border: 1px solid var(--border-color);
    }
    
    .rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    .toast {
      position: fixed;
      bottom: max(1.5rem, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(140%);
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.7rem 1.25rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.85rem;
      z-index: 200;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    
    .hint {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: center;
      flex-shrink: 0;
    }
    
    .label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body class="theme-slate">
  <div id="toast" class="toast">Ready</div>

  <div id="home-screen">
    <div class="home-card space-y-4">
      <div class="text-center space-y-1">
        <h1 class="text-2xl font-bold tracking-tight">
          Thread → <span style="background:var(--accent-grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Shorts</span>
        </h1>
        <p style="color:var(--text-muted);" class="text-xs">Paste thread → clean slides → record</p>
      </div>

      <!-- Theme Selector -->
      <div class="space-y-1">
        <label class="label">Visual Theme</label>
        <select id="theme-selector" onchange="changeTheme(this.value)">
          <option value="theme-slate">Midnight Slate (Dark)</option>
          <option value="theme-paper">Warm Paper &amp; Charcoal</option>
          <option value="theme-emerald">Deep Emerald</option>
          <option value="theme-neon">Cyber Neon</option>
        </select>
      </div>

      <div class="space-y-1.5">
        <label class="label">Thread URL (optional)</label>
        <div class="flex gap-2">
          <input type="url" id="url-input" placeholder="https://x.com/user/status/…" inputmode="url" />
          <button id="fetch-btn" onclick="fetchFromUrl()" class="primary-btn shrink-0 text-sm py-2 px-3">
            <span id="fetch-label">Fetch</span>
            <span id="fetch-spinner" class="hidden" style="width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin 0.65s linear infinite;"></span>
          </button>
        </div>
      </div>

      <div class="relative flex items-center gap-3 py-1">
        <div class="flex-1 h-px" style="background:var(--border-color);"></div>
        <span style="color:var(--text-muted);" class="text-xs">or paste text</span>
        <div class="flex-1 h-px" style="background:var(--border-color);"></div>
      </div>

      <div class="space-y-1.5">
        <label class="label">Thread text</label>
        <textarea id="thread-input" rows="5" placeholder="1/ Paste your thread text here

2/ Usernames and handles are automatically stripped out!

3/ Copy any image from X and press Ctrl+V on the slide."></textarea>
      </div>

      <div class="flex gap-2 pt-1">
        <button onclick="buildSlides()" class="primary-btn flex-1 justify-center text-sm py-2.5">
          Generate Slides
        </button>
        <button onclick="loadDemo()" class="ghost-btn text-sm py-2.5 px-4">
          Demo
        </button>
      </div>
    </div>
  </div>

  <div id="player-screen" class="hidden">
    <div class="top-bar">
      <button onclick="goHome()" class="ctrl-btn" aria-label="Home">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
      </button>
      
      <div style="color:var(--text-muted);" class="flex items-center gap-2 text-sm font-medium">
        <span id="slide-counter">1 / 1</span>
        <span id="rec-indicator" class="hidden items-center gap-1.5 text-red-400 font-semibold text-xs">
          <span class="rec-dot"></span> REC
        </span>
      </div>
      
      <button onclick="toggleTTS()" id="tts-btn" class="ctrl-btn" aria-label="Read aloud">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
      </button>
    </div>

    <div class="stage-wrapper" id="stage"></div>
    
    <p class="hint">Copy image from X → press <b>Ctrl+V</b> / Cmd+V on the slide</p>

    <div class="bottom-bar">
      <button onclick="prevSlide()" id="prev-btn" class="ctrl-btn" disabled aria-label="Previous">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div class="flex gap-2">
        <button onclick="startRecording()" id="rec-btn" class="primary-btn">
          <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
          Record
        </button>
        <button onclick="stopRecording()" id="stop-btn" class="danger-btn hidden">Stop</button>
      </div>
      <button onclick="nextSlide()" id="next-btn" class="ctrl-btn" aria-label="Next">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>

  <script>
    let slides = [];
    let current = 0;
    let isSpeaking = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let stream = null;

    function toast(msg, duration = 2600) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._tid);
      t._tid = setTimeout(() => t.classList.remove('show'), duration);
    }

    function changeTheme(themeClass) {
      document.body.className = themeClass;
    }

    function cleanText(t) {
      return (t || '')
        .replace(/https?:\/\/t\.co\/\S+/g, '')
        .replace(/https?:\/\/\S+/g, '')
        .replace(/@\w+/g, '') // strip usernames/handles
        .replace(/^[A-Za-z0-9_\s.'-]{1,40}\s*[·•\-|–—]\s*@?\w+.*$/gm, '') // strip "Name · @handle"
        .replace(/^(RT|via|from)\s+/i, '')
        .replace(/^\s*[A-Z][\w.'-]+(?:\s+[A-Z][\w.'-]+)?\s*:\s*/gm, '') // strip "Name:" prefixes
        .replace(/^\s*[·•\-–—]+\s*$/gm, '')
        .replace(/\s+/g, ' ')
        .replace(/^\s*[·•\-–—]+\s*/g, '')
        .trim();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }

    function parseUrl(url) {
      const m = url.match(/(?:x|twitter|fxtwitter|vxtwitter)\.com\/(?:#!\/)?(\w+)\/status(?:es)?\/(\d+)/i);
      if (m) return { handle: m[1], id: m[2] };
      const idOnly = url.match(/status\/(\d+)/i) || url.match(/^(\d{10,})$/);
      if (idOnly) return { handle: null, id: idOnly[1] };
      return null;
    }

    function extractImage(tw) {
      if (!tw) return null;
      const media = tw.media || {};
      if (Array.isArray(media.photos) && media.photos.length) {
        const p = media.photos[0];
        return (typeof p === 'string' ? p : (p.url || p.media_url_https || p.src)) || null;
      }
      if (Array.isArray(media.images) && media.images.length) {
        const p = media.images[0];
        return (typeof p === 'string' ? p : (p.url || p.media_url_https || p.src)) || null;
      }
      if (Array.isArray(media.all) && media.all.length) {
        const photo = media.all.find(x => !x.type || x.type === 'photo');
        if (photo) return photo.url || photo.media_url_https || photo.src || null;
        const first = media.all[0];
        if (first) return first.thumbnail_url || first.url || first.media_url_https || null;
      }
      if (Array.isArray(media.videos) && media.videos.length) {
        const v = media.videos[0];
        return v.thumbnail_url || v.thumbnail || null;
      }
      for (const key of ['entities', 'extended_entities']) {
        const arr = tw[key]?.media;
        if (Array.isArray(arr)) {
          const p = arr.find(x => x.type === 'photo') || arr[0];
          if (p) return p.media_url_https || p.media_url || p.url || null;
        }
      }
      return tw.image || tw.thumbnail_url || null;
    }

    async function fetchFromUrl() {
      const rawUrl = document.getElementById('url-input').value.trim();
      if (!rawUrl) { toast('Paste a URL first'); return; }
      const parsed = parseUrl(rawUrl);
      if (!parsed) { toast('Invalid URL'); return; }

      const btn = document.getElementById('fetch-btn');
      const label = document.getElementById('fetch-label');
      const spinner = document.getElementById('fetch-spinner');
      btn.disabled = true;
      label.classList.add('hidden');
      spinner.classList.remove('hidden');

      try {
        let items = [];
        try {
          const fxUrl = parsed.handle
            ? `
